function findDuplicateLecturerAssignment(assignments) {
  const seen = new Set();
  const normalizeCourse = value => String(value || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('id-ID');
  for (const item of (Array.isArray(assignments) ? assignments : [])) {
    const course = normalizeCourse(item && item.course);
    const cohorts = [...new Set((item && item.angkatan || []).map(x => String(x).trim()).filter(Boolean))];
    const classes = [...new Set((item && item.kelas || []).map(x => String(x).trim()).filter(Boolean))];
    for (const angkatan of cohorts) {
      for (const kelas of classes) {
        const key = `${course}\u0000${angkatan}\u0000${kelas}`;
        if (seen.has(key)) return { course: item.course, angkatan, kelas };
        seen.add(key);
      }
    }
  }
  return null;
}

function parseLecturerProfileRows(fieldId, label, keys) {
  const raw = $(fieldId)?.value || '';
  const lines = raw.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const rows = [];
  for (const line of lines) {
    const values = line.split('|').map(value => value.trim());
    if (values.length !== keys.length || values.some(value => !value)) {
      showToast(`Format ${label.toLowerCase()} harus berisi ${keys.join(' | ')} pada setiap baris.`, 'error');
      $(fieldId)?.focus();
      return null;
    }
    const item = {};
    keys.forEach((key, index) => item[key] = values[index]);
    rows.push(item);
  }
  return rows;
}

function saveNewUser(e) {
  e.preventDefault();
  const role = $('nu-role').value;
  const username = $('nu-username').value.trim();
  const name = $('nu-name').value.trim();

  if (db.users.some(u => u.username === username)) {
    showToast('Username sudah terdaftar. Gunakan NIM/NIP yang berbeda.', 'error');
    return;
  }

  const enteredGpa = role === 'student' ? Number($('nu-gpa')?.value) : null;
  if (role === 'student' && ($('nu-gpa')?.value === '' || !Number.isFinite(enteredGpa) || enteredGpa < 0 || enteredGpa > 4)) {
    showToast('IPK wajib diisi dengan angka antara 0,00 dan 4,00.', 'error');
    $('nu-gpa')?.focus();
    return;
  }

  const newUser = {
    id: uid('u'), username, password: $('nu-password').value || 'password123', role, name,
    prodi: $('nu-prodi').value.trim() || 'S1 Informatika', email: $('nu-email').value.trim(),
    avatar: SEED.student.avatar, active: true, createdAt: todayShort()
  };
  if (role === 'student') {
    newUser.nim = username;
    newUser.angkatan = $('nu-angkatan').value;
    newUser.kelas = $('nu-kelas').value;
    newUser.semester = semesterForCohort(newUser.angkatan);
    newUser.mataKuliahDiambil = Array.from(document.querySelectorAll('.nu-course-cb:checked')).map(cb => cb.value);
    newUser.gpa = Number(enteredGpa.toFixed(2)); newUser.mexs = 0; newUser.portfolioCount = 0; newUser.achievementCount = 0; newUser.skills = [];
  } else {
    newUser.nip = username;
    const mkList = [];
    const mkRows = Array.from(document.querySelectorAll('#nu-mk-list > div'));
    for (const row of mkRows) {
      const course = (row.querySelector('.mk-course')?.value || '').trim();
      const angkatan = Array.from(row.querySelectorAll('.mk-angkatan:checked')).map(cb => cb.value);
      const kelas = Array.from(row.querySelectorAll('.mk-kelas:checked')).map(cb => cb.value);
      if (!course) {
        showToast('Pilih mata kuliah atau hapus baris mata kuliah yang tidak digunakan.', 'error');
        row.querySelector('.mk-course')?.focus();
        return;
      }
      if (!angkatan.length || !kelas.length) {
        showToast(`Mata kuliah ${course}: pilih minimal satu angkatan dan satu kelas.`, 'error');
        row.scrollIntoView({ behavior:'smooth', block:'center' });
        return;
      }
      mkList.push({ course, angkatan, kelas });
    }
    const duplicateAssignment = findDuplicateLecturerAssignment(mkList);
    if (duplicateAssignment) {
      showToast(`Penugasan duplikat: ${duplicateAssignment.course}, angkatan ${duplicateAssignment.angkatan}, kelas ${duplicateAssignment.kelas}. Setiap kombinasi mata kuliah, angkatan, dan kelas hanya boleh tercatat satu kali pada dosen yang sama.`, 'error');
      return;
    }
    const pendidikan = parseLecturerProfileRows('nu-pendidikan', 'Riwayat pendidikan', ['jenjang', 'institusi', 'tahun']);
    if (pendidikan === null) return;
    const publikasi = parseLecturerProfileRows('nu-publikasi', 'Publikasi ilmiah', ['judul', 'jurnal', 'tahun']);
    if (publikasi === null) return;
    newUser.mataKuliahDiampu = mkList;
    newUser.bidangKeahlian = ($('nu-bidang-keahlian')?.value || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
    newUser.pendidikan = pendidikan;
    newUser.publikasi = publikasi;
  }

  db.users.push(newUser);
  if (role === 'lecturer') {
    newUser.mataKuliah = (newUser.mataKuliahDiampu || []).map(item => item.course).filter(Boolean).join(', ');
    syncLecturerCourseOfferings('', username, newUser.mataKuliahDiampu || [], newUser.name);
  }

  if (role === 'student') {
    // Jika NIM pernah ada sebagai data yatim, ganti seluruh nilai talenta dengan keadaan awal.
    const previousFiles = [
      ...db.portfolios.filter(p => String(p.nim || LEGACY_DEMO_STUDENT_NIM) === String(username)).map(p => p.fileId),
      ...db.achievements.filter(a => String(a.nim || LEGACY_DEMO_STUDENT_NIM) === String(username)).map(a => a.proofFileId)
    ].filter(Boolean);
    previousFiles.forEach(fileId => removeStoredDocument(fileId).catch(err => console.warn('Gagal membersihkan berkas akun lama', err)));
    db.portfolios = db.portfolios.filter(p => String(p.nim || LEGACY_DEMO_STUDENT_NIM) !== String(username));
    db.achievements = db.achievements.filter(a => String(a.nim || LEGACY_DEMO_STUDENT_NIM) !== String(username));
    db.skpiFinalizations = (db.skpiFinalizations || []).filter(f => String(f.nim) !== String(username));
    if (!db.studentProfiles) db.studentProfiles = {};
    delete db.studentProfiles[String(username)];
    const cleanTalent = {
      nim: username, name, prodi: newUser.prodi, angkatan: newUser.angkatan || '', kelas: newUser.kelas || '-',
      semester: newUser.semester, gpa: newUser.gpa, skills: [], portfolioCount: 0, mexs: 0, mexsBase: 0, achievementCount: 0,
      avatar: newUser.avatar, email: newUser.email
    };
    const talentIndex = db.talentPool.findIndex(t => String(t.nim) === String(username));
    if (talentIndex >= 0) db.talentPool[talentIndex] = cleanTalent;
    else db.talentPool.push(cleanTalent);
    db.studentProfiles[String(username)] = { phone:'', bio:'', skills:[] };
  }

  pushNotif('Akun baru terdaftar', `${name} (${role === 'student' ? 'Mahasiswa' : 'Dosen'}) telah ditambahkan ke sistem.`);
  if (!saveDB()) return;
  closeModal(); render();
  showToast(`Akun ${name} berhasil dibuat.`, 'success');
}

function syncStudentIdentityReferences(oldNim, newNim, updatedUser) {
  const replace = item => {
    if (!item || typeof item !== 'object') return;
    ['nim','creatorNim','studentNim','recipientNim','senderNim','fromNim'].forEach(key => {
      if (String(item[key] || '') === oldNim) item[key] = newNim;
    });
  };
  (db.talentPool || []).forEach(item => { replace(item); if (String(item.nim) === newNim) { item.name = updatedUser.name; item.prodi = updatedUser.prodi; item.email = updatedUser.email; } });
  (db.portfolios || []).forEach(item => replace(item));
  (db.achievements || []).forEach(item => replace(item));
  (db.skpiFinalizations || []).forEach(item => replace(item));
  (db.invitations || []).forEach(replace);
  (db.notifications || []).forEach(replace);
  (db.projects || []).forEach(project => {
    replace(project);
    if (String(project.creatorNim || '') === newNim) { project.creator = updatedUser.name; project.department = updatedUser.prodi; }
    (project.members || []).forEach(member => { if (String(member.nim || '') === newNim) { member.name = updatedUser.name; member.prodi = updatedUser.prodi; } });
    (project.applicants || []).forEach(member => { if (String(member.nim || '') === newNim) { member.name = updatedUser.name; member.prodi = updatedUser.prodi; } });
    (project.groups || []).forEach(group => (group.members || []).forEach(member => { if (String(member.nim || '') === newNim) { member.name = updatedUser.name; member.prodi = updatedUser.prodi; } }));
  });
  if (oldNim !== newNim && db.studentProfiles && db.studentProfiles[oldNim]) { db.studentProfiles[newNim] = db.studentProfiles[oldNim]; delete db.studentProfiles[oldNim]; }
  if (String(LEGACY_DEMO_STUDENT_NIM) === oldNim && db.studentProfile) db.studentProfile = db.studentProfiles[newNim] || db.studentProfile;
  if (String(SEED.student.nim) === oldNim) SEED.student.nim = newNim;
}
function syncLecturerIdentityReferences(oldNip, newNip, updatedUser) {
  (db.projects || []).forEach(project => {
    ['supervisorNip','creatorNip','ownerNip'].forEach(key => { if (String(project[key] || '') === oldNip) project[key] = newNip; });
    if (project.supervisorNip === newNip || project.creatorNip === newNip || project.ownerNip === newNip) {
      if (project.supervisor === updatedUser.name || project.supervisor === updatedUser._previousName) project.supervisor = updatedUser.name;
      if (project.creator === updatedUser._previousName && /dosen/i.test(String(project.creatorRole || ''))) project.creator = updatedUser.name;
    }
  });
  (db.masterData?.courseOfferings || []).forEach(item => {
    if (String(item.lecturerNip || '') === oldNip) { item.lecturerNip = newNip; item.lecturerName = updatedUser.name; }
  });
  (db.notifications || []).forEach(item => {
    ['recipientNip','lecturerNip','supervisorNip'].forEach(key => { if (String(item[key] || '') === oldNip) item[key] = newNip; });
  });
}
function syncLecturerCourseOfferings(oldNip, newNip, assignments, lecturerName) {
  if (!db.masterData) db.masterData = {};
  if (!Array.isArray(db.masterData.courseOfferings)) db.masterData.courseOfferings = [];
  const oldIds = new Set([String(oldNip || ''), String(newNip || '')].filter(Boolean));
  db.masterData.courseOfferings = db.masterData.courseOfferings.filter(item => !oldIds.has(String(item.lecturerNip || '')));
  (Array.isArray(assignments) ? assignments : []).forEach(item => {
    const course = String(item.course || '').trim();
    if (!course) return;
    (item.angkatan || []).forEach(angkatan => {
      (item.kelas || []).forEach(kelas => {
        db.masterData.courseOfferings.push({
          id: uid('MK'), course, lecturerNip: String(newNip || ''), lecturerName,
          kelas: String(kelas), angkatan: String(angkatan)
        });
      });
    });
  });
}

function saveEditUser(e, id) {

    const oldName = String(u.name || '');

    if (!isNonEmpty(prodi, 120)) { showToast('Program studi wajib diisi.', 'error'); return; }

    const oldNim = String(u.nim || oldUsername), oldNip = String(u.nip || oldUsername);
    u.name = name; u.username = username; u.prodi = prodi; u.email = email;
    if (u.role === 'student') {
      const rawGpa = $('eu-gpa')?.value ?? '';
      const gpa = Number(rawGpa);
      if (rawGpa === '' || !Number.isFinite(gpa) || gpa < 0 || gpa > 4) { showToast('IPK harus berupa angka antara 0,00 dan 4,00.', 'error'); $('eu-gpa')?.focus(); return; }
      u.nim = username;
      if ($('eu-angkatan')) u.angkatan = $('eu-angkatan').value.trim();
      if ($('eu-kelas')) u.kelas = $('eu-kelas').value.trim();
      u.semester = semesterForCohort(u.angkatan);
      u.gpa = Number(gpa.toFixed(2));
      u.mataKuliahDiambil = Array.from(document.querySelectorAll('.eu-course-cb:checked')).map(cb => cb.value);
      let talent = (db.talentPool || []).find(t => String(t.nim) === oldNim);
      if (!talent) { talent = { nim: username, skills: [], mexs: 0, portfolioCount: 0, achievementCount: 0 }; db.talentPool.push(talent); }
      talent.nim = username; talent.name = name; talent.prodi = prodi; talent.email = email;
      talent.angkatan = u.angkatan; talent.kelas = u.kelas; talent.semester = u.semester; talent.gpa = u.gpa;
      syncStudentIdentityReferences(oldNim, username, u);
      if (String(SEED.student.nim) === username) { SEED.student.gpa = u.gpa; SEED.student.angkatan = u.angkatan; SEED.student.kelas = u.kelas; }
    }
    if (u.role === 'lecturer') {
      u.nip = username;
      const mkList = [];
      const mkRows = Array.from(document.querySelectorAll('#eu-mk-list > div'));
      for (const row of mkRows) {
        const course = (row.querySelector('.emk-course')?.value || '').trim();
        const angkatan = Array.from(row.querySelectorAll('.emk-angkatan:checked')).map(cb => cb.value);
        const kelas = Array.from(row.querySelectorAll('.emk-kelas:checked')).map(cb => cb.value);
        if (!course) { showToast('Pilih mata kuliah atau hapus baris yang tidak digunakan.', 'error'); row.querySelector('.emk-course')?.focus(); return; }
        if (!angkatan.length || !kelas.length) { showToast(`Mata kuliah ${course}: pilih minimal satu angkatan dan satu kelas.`, 'error'); row.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
        mkList.push({ course, angkatan, kelas });
      }
      const duplicateAssignment = findDuplicateLecturerAssignment(mkList);
      if (duplicateAssignment) {
        showToast(`Penugasan duplikat: ${duplicateAssignment.course}, angkatan ${duplicateAssignment.angkatan}, kelas ${duplicateAssignment.kelas}. Setiap kombinasi mata kuliah, angkatan, dan kelas hanya boleh tercatat satu kali pada dosen yang sama.`, 'error');
        return;
      }
      const bidang = ($('eu-bidang-keahlian')?.value || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      const pendidikan = parseLecturerProfileRows('eu-pendidikan', 'Riwayat pendidikan', ['jenjang','institusi','tahun']);
      if (pendidikan === null) return;
      const publikasi = parseLecturerProfileRows('eu-publikasi', 'Publikasi ilmiah', ['judul','jurnal','tahun']);
      if (publikasi === null) return;
      u.mataKuliahDiampu = mkList; u.mataKuliah = mkList.map(item => item.course).filter(Boolean).join(', ');
      u.bidangKeahlian = bidang; u.pendidikan = pendidikan; u.publikasi = publikasi;
      u._previousName = oldName;
      syncLecturerIdentityReferences(oldNip, username, u);
      syncLecturerCourseOfferings(oldNip, username, mkList, u.name);
      delete u._previousName;
      if (String(SEED.lecturer.nip) === username || String(SEED.lecturer.nip) === oldNip) {
        Object.assign(SEED.lecturer, { nip:username, name, email, prodi,
          mataKuliah: u.mataKuliah, mataKuliahDiampu:mkList, bidangKeahlian:bidang, pendidikan, publikasi });
      }
    }
    if (!saveDB()) return;
    if (u.role === 'student' && (String(SEED.student.nim) === oldUsername || String(SEED.student.nim) === username)) syncStudentIdentityFromAdmin();
    closeModal(); render(); showToast('Seluruh data akun berhasil diperbarui.', 'success');
  } catch (err) { console.error(err); showToast('Data akun gagal diperbarui.', 'error'); }
}

async function confirmDeleteUser(id) {
  const u = db.users.find(x => x.id === id);
  if (!u) return;

  const studentNim = u.role === 'student' ? String(u.nim || u.username || '') : '';
  const filesToRemove = new Set();
  if (studentNim) {
    const belongsToStudent = item => String(item?.nim || LEGACY_DEMO_STUDENT_NIM) === studentNim;
    (db.portfolios || []).filter(belongsToStudent).forEach(item => {
      if (item.fileId) filesToRemove.add(item.fileId);
      if (item.file?.id) filesToRemove.add(item.file.id);
    });
    (db.achievements || []).filter(belongsToStudent).forEach(item => {
      if (item.proofFileId) filesToRemove.add(item.proofFileId);
    });

    const ownedProjectIds = new Set();
    (db.projects || []).forEach(project => {
      if (String(project.creatorNim || '') === studentNim) {
        ownedProjectIds.add(String(project.id));
        if (project.attachment?.id) filesToRemove.add(project.attachment.id);
        (project.milestones || []).forEach(milestone => { if (milestone.fileId) filesToRemove.add(milestone.fileId); });
        (project.groups || []).forEach(group => (group.milestones || []).forEach(milestone => {
          if (milestone.fileId) filesToRemove.add(milestone.fileId);
        }));
      }
    });
    db.projects = (db.projects || []).filter(project => !ownedProjectIds.has(String(project.id)));
    db.projects.forEach(project => {
      project.members = (project.members || []).filter(member => String(member.nim || '') !== studentNim);
      project.applicants = (project.applicants || []).filter(member => String(member.nim || '') !== studentNim);
      (project.groups || []).forEach(group => {
        group.members = (group.members || []).filter(member => String(member.nim || '') !== studentNim);
      });
    });

    db.portfolios = (db.portfolios || []).filter(item => !belongsToStudent(item));
    db.achievements = (db.achievements || []).filter(item => !belongsToStudent(item));
    db.talentPool = (db.talentPool || []).filter(item => String(item?.nim || '') !== studentNim);
    db.skpiFinalizations = (db.skpiFinalizations || []).filter(item => String(item.nim || '') !== studentNim);
    db.invitations = (db.invitations || []).filter(item =>
      String(item.nim || item.studentNim || item.recipientNim || '') !== studentNim &&
      String(item.senderNim || item.fromNim || '') !== studentNim &&
      !ownedProjectIds.has(String(item.projectId || ''))
    );
    db.notifications = (db.notifications || []).filter(item =>
      String(item.recipientNim || item.studentNim || item.nim || '') !== studentNim &&
      !ownedProjectIds.has(String(item.projectId || ''))
    );
    if (!db.studentProfiles || typeof db.studentProfiles !== 'object') db.studentProfiles = {};
    delete db.studentProfiles[studentNim];
    // studentProfile adalah alias kompatibilitas lama, bukan sumber data untuk semua akun.
    if (studentNim === String(LEGACY_DEMO_STUDENT_NIM)) delete db.studentProfile;
    else if (db.studentProfile && typeof db.studentProfile === 'object') db.studentProfile = { phone:'', bio:'', skills:[] };
  }

  const removedProjectIds = new Set();
  if (u.role === 'lecturer') {
    const lecturerNip = String(u.nip || u.username || '');
    const lecturerName = String(u.name || '');
    (db.projects || []).forEach(project => {
      const supervisedOrOwned = String(project.supervisorNip || '') === lecturerNip
        || String(project.creatorNip || '') === lecturerNip
        || String(project.ownerNip || '') === lecturerNip
        || (!project.supervisorNip && String(project.supervisor || '') === lecturerName)
        || (!project.creatorNip && String(project.creator || '') === lecturerName && /dosen/i.test(String(project.creatorRole || '')));
      if (!supervisedOrOwned) return;
      removedProjectIds.add(String(project.id));
      if (project.attachment?.id) filesToRemove.add(project.attachment.id);
      (project.milestones || []).forEach(milestone => { if (milestone.fileId) filesToRemove.add(milestone.fileId); });
      (project.groups || []).forEach(group => (group.milestones || []).forEach(milestone => { if (milestone.fileId) filesToRemove.add(milestone.fileId); }));
    });
    db.projects = (db.projects || []).filter(project => !removedProjectIds.has(String(project.id)));
    db.invitations = (db.invitations || []).filter(item =>
      !removedProjectIds.has(String(item.projectId || '')) && String(item.senderNip || item.lecturerNip || '') !== lecturerNip
    );
    db.notifications = (db.notifications || []).filter(item =>
      !removedProjectIds.has(String(item.projectId || '')) && String(item.recipientNip || item.lecturerNip || '') !== lecturerNip
    );
  }

  db.users = db.users.filter(x => x.id !== id);
  if (!saveDB()) return;
  closeModal(); render();
  if (filesToRemove.size) {
    await Promise.all(Array.from(filesToRemove).map(fileId => removeStoredDocument(fileId).catch(err => {
      console.warn('KREASI: berkas terkait akun/proyek yang dihapus tidak dapat dibersihkan', err);
    })));
  }
  showToast(`Akun ${u.name} dan seluruh data terkait berhasil dihapus.`, 'info');
}

  const v = $('ec-name').value.trim();
  if (!v) return;
  if ([COURSE_CATEGORY, COMMUNITY_CATEGORY].includes(old)) {
    showToast('Nama kategori sistem tidak dapat diubah karena terhubung ke aturan proyek khusus.', 'warn');
    return;
  }
  if (v !== old && db.masterData.projectCategories.includes(v)) {
    showToast('Nama kategori tersebut sudah digunakan.', 'warn');
    return;
  }
  db.masterData.projectCategories = db.masterData.projectCategories.map(c => c === old ? v : c);
  db.projects.forEach(project => { if (project.category === old) project.category = v; });
  if (!saveDB()) return;
  closeModal(); render();
  showToast(`Kategori diubah menjadi "${v}" dan disinkronkan ke proyek terkait.`, 'success');
}
function deleteCategory(c) {
  if ([COURSE_CATEGORY, COMMUNITY_CATEGORY].includes(c)) {
    showToast('Kategori sistem tidak dapat dihapus karena digunakan untuk aturan khusus proyek.', 'warn');
    return;
  }
  db.masterData.projectCategories = db.masterData.projectCategories.filter(x => x !== c);
  if (!saveDB()) return;
  render();
  showToast(`Kategori "${c}" dihapus dari seluruh pilihan kategori proyek. Proyek lama tetap tersimpan sebagai riwayat.`, 'info');
}

function masterThreshold() {
  const v = (typeof db.masterData?.mexsThreshold === 'number' && db.masterData.mexsThreshold > 0) ? db.masterData.mexsThreshold : 1000;
  const stats = db.talentPool.map(s => {
    const raw = (s.nim === SEED.student.nim) ? mexsPoints() : s.mexs;
    const currentMexs = (typeof raw === 'number' && !isNaN(raw)) ? raw : 0;
    return { ...s, currentMexs, achieved: currentMexs >= v };
  });
  const achievedCount = stats.filter(s => s.achieved).length;

  return `
  <div class="grid lg:grid-cols-3 gap-5">
    <section class="dash-card p-6 lg:col-span-1 h-fit">
      <h2 class="text-sm font-extrabold text-slate-900">Ambang Batas Poin MEXS</h2>
      <p class="text-2xs text-slate-500 mt-1">Target capaian poin MEXS standar bagi mahasiswa sebagai syarat akademik.</p>
      <form onsubmit="saveThreshold(event)" class="space-y-4 mt-5">
        <div>
          <label class="lbl" for="th-value">Nilai Ambang (Poin)</label>
          <input id="th-value" type="number" min="0" max="500" class="inp" value="${v}" required>
          <p class="hint">Isi 0 jika tidak ada ambang batas khusus.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Simpan Ambang</button>
      </form>
    </section>

    <section class="dash-card lg:col-span-2 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h2 class="text-sm font-extrabold text-slate-900">Status Capaian Mahasiswa</h2>
          <p class="text-2xs text-slate-500 mt-1">${achievedCount} dari ${stats.length} mahasiswa telah mencapai ambang batas.</p>
        </div>
        <span class="text-2xs font-bold text-slate-500">Target ${v} poin</span>
      </div>
      <div class="overflow-x-auto scroll-thin-light">
        <table class="tbl">
          <caption class="sr-only">Status capaian MEXS mahasiswa</caption>
          <thead>
            <tr><th scope="col">Mahasiswa</th><th scope="col">Total MEXS</th><th scope="col">Capaian</th><th scope="col">Status</th></tr>
          </thead>
          <tbody>
            ${stats.map(s => {
              const pct = v > 0 ? Math.min(100, Math.round((s.currentMexs / v) * 100)) : 0;
              return `
              <tr data-search="${esc(s.name)} ${esc(s.nim)}">
                <td><p class="font-semibold text-slate-800 leading-snug">${esc(s.name)}</p><p class="text-2xs text-slate-500 mt-0.5">${esc(s.nim)}</p></td>
                <td><span class="font-bold text-slate-800">${s.currentMexs}</span> <span class="text-2xs text-slate-400">/ ${v}</span></td>
                <td class="w-40">${progressBar(pct)}<p class="text-2xs text-slate-500 mt-1">${pct}%</p></td>
                <td>${badge(s.achieved ? 'Disetujui' : 'Belum Dimulai')}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div id="search-empty" class="hidden px-6 py-4 text-xs text-slate-500 border-t border-slate-100">Tidak ada data yang cocok dengan pencarian.</div>
    </section>
  </div>`;
}

function saveThreshold(e) {
  e.preventDefault();
  const v = parseInt($('th-value').value, 10);
  if (!v || v < 0) { showToast('Masukkan nilai ambang yang valid.', 'error'); return; }
  db.masterData.mexsThreshold = v;
  SEED.student.targetMexs = v;
  saveDB(); render();
  showToast(`Ambang batas MEXS diset ke ${v} poin.`, 'success');
}

/* --------------------------- REKAPITULASI & SKPI -------------------------- */
function adminSkpi() {
  const threshold = (typeof db.masterData?.mexsThreshold === 'number' && db.masterData.mexsThreshold > 0) ? db.masterData.mexsThreshold : 1000;
  const rows = db.talentPool.map(s => {
    const mexs = mexsPoints(s.nim);
    const final = db.skpiFinalizations.find(f => String(f.nim) === String(s.nim));
    return { ...s, mexs, final, achieved: mexs >= threshold };
  });
  const totalFinal = rows.filter(r => !!r.final).length;
  const totalAchieved = rows.filter(r => r.achieved).length;

  return `
  ${pageTitle('REKAPITULASI & FINALISASI SKPI', 'Pemantauan Poin MEXS & Dokumen SKPI',
      'Administrator dapat memfinalisasi, membatalkan finalisasi, dan mencetak SKPI secara langsung.')}

  <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
    ${dashStat('fa-users', rows.length, 'Total Mahasiswa')}
    ${dashStat('fa-circle-check', totalAchieved, 'Mencapai Ambang MEXS')}
    ${dashStat('fa-file-signature', totalFinal, 'SKPI Terfinalisasi')}
  </div>

  <section class="dash-card overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100">
      <h2 class="text-sm font-extrabold text-slate-900">Rekapitulasi Poin MEXS Mahasiswa</h2>
      <p class="text-2xs text-slate-500 mt-1">Gunakan aksi pada setiap mahasiswa untuk mengelola finalisasi dan mencetak SKPI.</p>
    </div>
    <div class="overflow-x-auto scroll-thin-light">
      <table class="tbl">
        <caption class="sr-only">Rekapitulasi poin MEXS dan status SKPI mahasiswa</caption>
        <thead>
          <tr>
            <th scope="col">Mahasiswa</th>
            <th scope="col">Program Studi</th>
            <th scope="col">IPK</th>
            <th scope="col">Total MEXS</th>
            <th scope="col">Capaian</th>
            <th scope="col">Status SKPI</th>
            <th scope="col" class="text-right">Aksi Admin</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length ? rows.map(r => {
            const pct = threshold > 0 ? Math.min(100, Math.round((r.mexs / threshold) * 100)) : 0;
            const status = r.final
              ? `<span class="badge badge-success"><i class="fa-solid fa-file-signature" aria-hidden="true"></i>Final</span>`
              : `<span class="badge badge-neutral"><i class="fa-solid fa-minus" aria-hidden="true"></i>Belum Final</span>`;
            return `
            <tr data-search="${esc(r.name)} ${esc(r.nim)} ${esc(r.prodi)}">
              <td>
                <div class="flex items-center gap-3 min-w-0">
                  <img src="${esc(r.avatar || '')}" alt="" class="w-9 h-9 rounded-full object-cover shrink-0">
                  <div class="min-w-0">
                    <p class="font-semibold text-slate-800 leading-snug truncate">${esc(r.name)}</p>
                    <p class="text-2xs text-slate-500 font-mono">${esc(r.nim)}</p>
                  </div>
                </div>
              </td>
              <td><span class="text-2xs font-semibold text-slate-600">${esc(r.prodi)}</span></td>
              <td><span class="font-semibold text-slate-800">${(r.gpa || 0).toFixed(2)}</span></td>
              <td><span class="font-bold text-slate-800">${r.mexs}</span> <span class="text-2xs text-slate-400">/ ${threshold}</span></td>
              <td class="w-40">${progressBar(pct)}<p class="text-2xs text-slate-500 mt-1">${pct}%</p></td>

              <td class="text-right">
                <div class="flex flex-wrap justify-end gap-2 min-w-[190px]">
                  ${r.final
                    ? `<button onclick="openSkpiFinalDetail('${esc(r.nim)}')" class="btn btn-secondary btn-sm">Detail</button>
                       <button onclick="printSkpi('${esc(r.nim)}')" class="btn btn-primary btn-sm"><i class="fa-solid fa-print" aria-hidden="true"></i> Cetak SKPI</button>
                       <button onclick="unfinalizeSkpi('${esc(r.nim)}')" class="btn btn-danger btn-sm">Batalkan Finalisasi</button>`
                    : `<button onclick="openFinalizeSkpiModal('${esc(r.nim)}')" class="btn btn-primary btn-sm"><i class="fa-solid fa-file-signature" aria-hidden="true"></i> Finalisasi SKPI</button>`}
                </div>
              </td>
            </tr>`;

    </div>

function openFinalizeSkpiModal(nim) {
  if (state.userRole !== 'admin') { showToast('Hanya administrator yang dapat memproses finalisasi.', 'error'); return; }
  const s = db.talentPool.find(x => String(x.nim) === String(nim));
  if (!s) return;
  const mexs = mexsPoints(s.nim);
  const threshold = (typeof db.masterData?.mexsThreshold === 'number' && db.masterData.mexsThreshold > 0) ? db.masterData.mexsThreshold : 1000;

  openModal({
    title: 'Finalisasi SKPI Mahasiswa', subtitle: `${s.name} (${s.nim})`, size: 'md',
    body: `
    <div class="space-y-4">
      <div class="grid sm:grid-cols-2 gap-3">
        <div class="p-3.5 rounded-2xl bg-white border border-slate-200">
          <p class="text-2xs font-bold text-violet-700 uppercase">Total Poin MEXS</p>
          <p class="text-sm font-extrabold text-slate-900 mt-1">${mexs} / ${threshold}</p>
        </div>
        <div class="p-3.5 rounded-2xl bg-white border border-slate-200">
          <p class="text-2xs font-bold text-violet-700 uppercase">Status Capaian</p>
          <p class="text-sm font-extrabold text-slate-900 mt-1">${mexs >= threshold ? 'Mencapai Ambang' : 'Belum Mencapai'}</p>
        </div>
      </div>
      <div>
        <label class="lbl" for="fin-note">Catatan Finalisasi (opsional)</label>
        <textarea id="fin-note" rows="3" class="inp" placeholder="Catatan verifikasi atau keterangan tambahan untuk dokumen SKPI..."></textarea>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeModal()" class="btn btn-secondary">Batal</button>
        <button type="button" onclick="saveFinalizeSkpiFromModal('${esc(nim)}')" class="btn btn-primary"><i class="fa-solid fa-file-signature" aria-hidden="true"></i> Setujui Finalisasi</button>
      </div>
    </div>`
  });
}

function saveFinalizeSkpiFromModal(nim) {
  const fakeEvent = { preventDefault() {} };
  saveFinalizeSkpi(fakeEvent, nim);
}

function saveFinalizeSkpi(e, nim) {
  if (e && typeof e.preventDefault === 'function') e.preventDefault();
  if (state.userRole !== 'admin') { showToast('Hanya administrator yang dapat memproses finalisasi.', 'error'); return; }
  const existing = db.skpiFinalizations.find(f => String(f.nim) === String(nim));
  const student = db.talentPool.find(item => String(item.nim) === String(nim));
  const note = ($('fin-note')?.value || '').trim();
  if (!student) { showToast('Data mahasiswa tidak ditemukan.', 'error'); return; }
  if (existing) { showToast('SKPI mahasiswa ini sudah difinalisasi.', 'warn'); return; }
  db.skpiFinalizations.push({ nim: String(nim), finalizedBy: db.admin?.name || SEED.admin.name, finalizedAt: todayShort(), note });
  pushNotif('SKPI telah difinalisasi', `Administrator telah memfinalisasi SKPI Anda.`, { recipientRole: 'student', recipientNim: String(nim) });
  if (!saveDB()) return;
  closeModal(); render();
  showToast('SKPI berhasil difinalisasi.', 'success');
}

function unfinalizeSkpi(nim) {
  if (state.userRole !== 'admin') { showToast('Hanya administrator yang dapat membatalkan finalisasi.', 'error'); return; }
  const finalRecord = db.skpiFinalizations.find(item => String(item.nim) === String(nim));
  if (!finalRecord) { showToast('SKPI mahasiswa ini belum difinalisasi.', 'warn'); return; }
  const student = db.talentPool.find(item => String(item.nim) === String(nim));
  openModal({
    title: 'Batalkan Finalisasi SKPI', size: 'sm',
    body: `<p class="text-xs text-slate-600 leading-relaxed">Administrator akan membatalkan finalisasi SKPI milik ${esc(student?.name || nim)}. Mahasiswa dapat kembali menambahkan atau memperbarui prestasi.</p>`,
    footer: `<button onclick="closeModal()" class="btn btn-secondary">Kembali</button>
             <button onclick="confirmUnfinalize('${esc(nim)}')" class="btn btn-danger">Konfirmasi Pembatalan</button>`
  });
}

function confirmUnfinalize(nim) {
  if (state.userRole !== 'admin') { showToast('Hanya administrator yang dapat membatalkan finalisasi.', 'error'); return; }
  const finalIndex = db.skpiFinalizations.findIndex(f => String(f.nim) === String(nim));
  if (finalIndex < 0) { showToast('SKPI mahasiswa ini belum difinalisasi.', 'warn'); return; }
  db.skpiFinalizations.splice(finalIndex, 1);
  pushNotif('Finalisasi SKPI dibatalkan', 'Administrator telah membatalkan finalisasi SKPI Anda. Anda dapat mengajukan atau memperbarui prestasi kembali.', { recipientRole: 'student', recipientNim: String(nim) });
  if (!saveDB()) return;
  closeModal(); render();
  showToast('Finalisasi SKPI berhasil dibatalkan.', 'success');
}

function openSkpiFinalDetail(nim) {
  const s = db.talentPool.find(x => String(x.nim) === String(nim));
  const f = db.skpiFinalizations.find(x => String(x.nim) === String(nim));
  if (!s || !f) return;
  const mexs = mexsPoints(s.nim);
  const threshold = (typeof db.masterData?.mexsThreshold === 'number' && db.masterData.mexsThreshold > 0) ? db.masterData.mexsThreshold : 1000;

  openModal({
    title: 'Detail Finalisasi SKPI', subtitle: `${s.name} (${s.nim})`, size: 'md',
    body: `
    <div class="space-y-4">
      <div class="grid sm:grid-cols-2 gap-3">
        <div class="p-3.5 rounded-2xl bg-violet-50/60 border border-violet-100">
          <p class="text-2xs font-bold text-violet-700 uppercase">Difinalisasi Oleh</p>
          <p class="text-xs font-semibold text-slate-800 mt-1">${esc(f.finalizedBy)}</p>
        </div>
        <div class="p-3.5 rounded-2xl bg-violet-50/60 border border-violet-100">
          <p class="text-2xs font-bold text-violet-700 uppercase">Tanggal</p>
          <p class="text-xs font-semibold text-slate-800 mt-1">${esc(f.finalizedAt)}</p>
        </div>
        <div class="p-3.5 rounded-2xl bg-white border border-slate-200">
          <p class="text-2xs font-bold text-slate-500 uppercase">Total Poin MEXS</p>
          <p class="text-xs font-semibold text-slate-800 mt-1">${mexs} / ${threshold}</p>
        </div>
        <div class="p-3.5 rounded-2xl bg-white border border-slate-200">
          <p class="text-2xs font-bold text-slate-500 uppercase">Status</p>
          <p class="text-xs font-semibold text-violet-700 mt-1">Final</p>
        </div>
      </div>
      ${f.note ? `
        <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
          <p class="text-2xs font-bold text-slate-500 uppercase">Catatan</p>
          <p class="text-xs text-slate-700 mt-1 leading-relaxed">${esc(f.note)}</p>
        </div>` : ''}
    </div>`,
    footer: `<button onclick="closeModal()" class="btn btn-secondary">Tutup</button>`
  });
}

// Ambil state server terlebih dahulu agar data database lebih baru daripada cache browser.
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const response = await apiRequest('/api/state/');
    if (response.ok) {
      const result = await response.json();
      if (result.data) localStorage.setItem(STORAGE_KEY, JSON.stringify(result.data));
    }
  } catch (error) {
    // Jika server sementara tidak terjangkau, data cache masih dapat membuka UI untuk demo lokal.
    console.warn('KREASI: state server tidak dapat dimuat, memakai salinan browser:', error.message);
  }
  loadDB();
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
