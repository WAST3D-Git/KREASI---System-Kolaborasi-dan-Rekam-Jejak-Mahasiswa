  }
  container.innerHTML = html;
  validateGroupMembership();
  applyGroupMemberFilters();
  refreshGroupCounters();
}

/* Filter angkatan, kelas, dan pencarian — hanya menyembunyikan baris sehingga pilihan tidak hilang */
function applyGroupMemberFilters() {
  const ang = $('member-filter-angkatan') ? $('member-filter-angkatan').value : '';
  const kls = $('member-filter-kelas') ? $('member-filter-kelas').value : '';
  document.querySelectorAll('[data-group-members]').forEach(list => {
    const idx = list.getAttribute('data-group-members');
    const inp = document.querySelector(`.grp-search[data-group-index="${idx}"]`);
    const term = ((inp && inp.value) || '').toLowerCase().trim();
    let visible = 0;
    const rows = list.querySelectorAll('[data-group-member-search]');
    rows.forEach(el => {
      const okS = !term || (el.getAttribute('data-group-member-search') || '').includes(term);
      const okA = !ang || el.getAttribute('data-angkatan') === ang;
      const okK = !kls || el.getAttribute('data-kelas') === kls;
      const show = okS && okA && okK;
      el.classList.toggle('hidden', !show);
      if (show) visible++;
    });
    const empty = list.querySelector('.grp-empty');
    if (empty) empty.classList.toggle('hidden', !rows.length || visible > 0);
  });
}
function filterGroupMemberList() { applyGroupMemberFilters(); }

function effectiveGroupMemberCount(idx) {
  return document.querySelectorAll(`.grp-member-checkbox[data-group-index="${idx}"]:checked`).length;
}
function refreshGroupCounters() {
  const { per } = currentGroupConfig();
  document.querySelectorAll('.grp-count').forEach(counter => {
    const idx = counter.getAttribute('data-group-index');
    const n = effectiveGroupMemberCount(idx);
    counter.textContent = n;
    const st = document.querySelector(`.grp-status[data-group-index="${idx}"]`);
    if (!st) return;
    if (n >= per) {
      st.className = 'grp-status text-2xs font-semibold text-violet-700';
      st.innerHTML = '<i class="fa-solid fa-circle-check mr-1" aria-hidden="true"></i>Kelompok lengkap';
    } else {
      st.className = 'grp-status text-2xs font-semibold text-violet-700';
      st.innerHTML = '<i class="fa-solid fa-user-plus mr-1" aria-hidden="true"></i>' +
        (n === 0 ? 'Belum ada anggota' : `Belum lengkap, kurang ${per - n} anggota`);
    }
  });
}

function updateGroupCount(idx, cb) {
  const { per } = currentGroupConfig();
  if (cb && cb.checked) {
    const dup = Array.from(document.querySelectorAll('.grp-member-checkbox:checked'))
      .find(o => o !== cb && o.value === cb.value);
    if (dup) {
      cb.checked = false;
      const other = document.querySelector(`.grp-name[data-group-index="${dup.getAttribute('data-group-index')}"]`);
      showToast(`${cb.getAttribute('data-name')} sudah dipilih di ${other ? other.value : 'kelompok lain'}.`, 'warn');
    } else if (effectiveGroupMemberCount(idx) > per) {
      cb.checked = false;
      showToast(`Kuota kelompok penuh (maks. ${per} anggota).`, 'warn');
    }
  }
  refreshGroupCounters();
}

function validateGroupMembership() {
  const seen = new Map();
  document.querySelectorAll('.grp-member-checkbox:checked').forEach(cb => {
    if (seen.has(cb.value)) cb.checked = false; else seen.set(cb.value, true);
  });
  refreshGroupCounters();
}

function collectGroupsFromDOM() {
  const container = $('np-groups-container');
  if (!container) return [];
  const groups = [];
  container.querySelectorAll('.grp-name').forEach(inp => {
    const idx = parseInt(inp.getAttribute('data-group-index'), 10);
    const name = inp.value.trim() || `Kelompok ${idx + 1}`;
    const selected = Array.from(container.querySelectorAll(`.grp-member-checkbox[data-group-index="${idx}"]:checked`)).map(cb => ({
      nim: cb.getAttribute('data-nim'),
      name: cb.getAttribute('data-name'),
      prodi: cb.getAttribute('data-prodi')
    }));
    const creatorSelected = isStudentCourseGroupForm() && selected.some(m => String(m.nim) === String(SEED.student.nim));
    const members = selected.map((member, index) => ({
      ...member,
      role: creatorSelected ? (String(member.nim) === String(SEED.student.nim) ? 'Ketua' : 'Anggota') : (index === 0 ? 'Ketua' : 'Anggota')
    }));
    groups[idx] = { name, members };
  });
  return groups.filter(Boolean);
}

function selectedGroupMemberCountFromForm() {
  return Array.from(document.querySelectorAll('.grp-member-checkbox:checked')).length;
}
function groupsMemberCountFromCurrentForm() {

async function saveNewProject(e) {
  if (e && typeof e.preventDefault === 'function') e.preventDefault();
  if (state.userRole === 'admin') { showToast('Administrator tidak memiliki akses untuk membuat atau meninjau proyek.', 'error'); return; }
  try {
    const role = state.userRole || 'student';
    const editingProject = state.editingProjectId ? getProject(state.editingProjectId) : null;
    if (state.editingProjectId && !canEditStudentProjectProposal(editingProject)) {
      showToast('Usulan ini tidak lagi dapat diedit karena bukan milik Anda atau sudah diproses dosen.', 'error');
      closeModal(); render(); return;
    }
    const categories = getProjectCategoryOptions(role);
    if (editingProject && !categories.includes(editingProject.category)) categories.push(editingProject.category);
    const categoryEl = $('np-category');
    const category = categoryEl ? categoryEl.value : '';
    const file = $('np-file')?.files?.[0] || null;
    const lecturer = role === 'lecturer' ? activeLecturerRecord() : null;
    const lecturerName = lecturer?.name || SEED.lecturer.name;
    const lecturerNip = lecturer?.nip || SEED.lecturer.nip;
    const isLecturer = role === 'lecturer';
    const isStudent = role === 'student';
    const isGroup = !!($('np-isgroup') && $('np-isgroup').checked);
    const course = category === COURSE_CATEGORY
      ? ($('np-course')?.value || '').trim()
      : category === COMMUNITY_CATEGORY ? communityCourseName() : '';

    const valueOf = id => ($(id)?.value || '').trim();
    const requireText = (id, label, maxLength) => {
      const field = $(id);
      const value = valueOf(id);
      if (!isNonEmpty(value, maxLength)) {
        showToast(`${label} wajib diisi dan maksimal ${maxLength} karakter.`, 'error');
        if (field) field.focus();
        return null;
      }
      return value;
    };

    if (!categories.includes(category)) {
      showToast('Kategori proyek tidak valid untuk peran Anda.', 'error');
      categoryEl?.focus();
      return;
    }
    if (category === COURSE_CATEGORY && isCommunityCourseName(course)) {
      showToast('Mata kuliah Informatika Untuk Masyarakat harus dibuat melalui kategori Informatika Untuk Masyarakat, bukan Proyek Mata Kuliah.', 'error');
      $('np-course')?.focus();
      return;
    }
    if (isStudent && category === COMMUNITY_CATEGORY && !studentTakesCommunityCourse(SEED.student && SEED.student.nim)) {
      showToast('Hanya mahasiswa yang mengambil mata kuliah Informatika Untuk Masyarakat yang dapat mengusulkan proyek pada kategori ini.', 'error');
      categoryEl?.focus();
      return;
    }
    if (isLecturer && (!lecturer || !lecturer.active)) {
      showToast('Data dosen aktif tidak ditemukan. Silakan masuk kembali.', 'error');
      return;
    }
    if (isLecturer && category === COMMUNITY_CATEGORY && !lecturerTeachesCommunityCourse(lecturerNip)) {
      showToast('Kategori Informatika Untuk Masyarakat hanya tersedia bagi dosen yang tercatat mengampu mata kuliah tersebut.', 'error');
      return;
    }
    const title = requireText('np-title', 'Nama proyek', 150);
    if (title === null) return;
    const period = requireText('np-period', 'Periode', 100);
    if (period === null) return;
    const description = requireText('np-desc', 'Deskripsi kegiatan', 2000);
    if (description === null) return;
    const requirements = requireText('np-req', 'Persyaratan anggota', 1500);
    if (requirements === null) return;

    let mitra = 'Program Studi S1 Informatika';
    let lokasi = 'Kampus Gunung Kelua';
    if (category !== COURSE_CATEGORY) {
      mitra = requireText('np-mitra', 'Mitra / instansi sasaran', 180);
      if (mitra === null) return;
      lokasi = requireText('np-lokasi', 'Lokasi pelaksanaan', 180);
      if (lokasi === null) return;
    }

    if (file) {
      if (file.size > 5 * 1024 * 1024) {
        showToast('Ukuran dokumen pendukung maksimal 5 MB.', 'error');
        return;
      }
      if (!/\.(pdf|doc|docx)$/i.test(file.name)) {
        showToast('Format dokumen pendukung harus PDF, DOC, atau DOCX.', 'error');
        return;
      }
    }

    let supervisorName = '';
    let supervisorNip = '';
    if (isLecturer) {
      supervisorName = lecturerName;
      supervisorNip = lecturerNip;
    } else if (isStudent && category === COURSE_CATEGORY) {
      const supNip = $('np-sc-dosen')?.value || '';
      if (supNip) {
        const supervisor = db.users.find(u => u.role === 'lecturer' && u.nip === supNip && u.active);
        if (supervisor) { supervisorName = supervisor.name; supervisorNip = supervisor.nip; }
      }
    }

    // Cakupan Proyek Mata Kuliah wajib sesuai dengan dosen pengampu, angkatan, dan kelas.
    let angkatan = '';
    let kelasList = [];
    let taskStudents = [];
    if (category === COURSE_CATEGORY && (isStudent || isLecturer)) {
      if (isStudent) {
        if (!course || !courseChoicesForStudent(SEED.student.nim).includes(course)) {
          showToast('Pilih mata kuliah yang Anda ambil.', 'error');
          $('np-course')?.focus();
          return;
        }
        if (!supervisorNip || !lecturersForCourse(course).some(l => l.nip === supervisorNip)) {
          showToast('Pilih dosen pengampu mata kuliah tersebut.', 'error');
          $('np-sc-dosen')?.focus();
          return;
        }
      } else if (!isLecturer) {
        showToast('Hanya dosen pengampu atau mahasiswa yang dapat membuat Proyek Mata Kuliah.', 'error');
        return;
      }
      const courseScope = courseScopeForLecturer(supervisorNip || lecturerNip, course);
      if (!course || !courseScope) {
        showToast('Pilih mata kuliah yang tercatat pada dosen pengampu.', 'error');
        $('np-course')?.focus();
        return;
      }
      angkatan = $('np-c-angkatan')?.value || '';
      kelasList = Array.from(document.querySelectorAll('.np-c-kelas:checked')).map(cb => cb.value);
      if (!angkatan || !(courseScope.angkatan || []).includes(angkatan)) {
        showToast('Pilih angkatan yang diampu dosen pada mata kuliah tersebut.', 'error');
        $('np-c-angkatan')?.focus();
        return;
      }
      if (!kelasList.length || kelasList.some(k => !(courseScope.kelas || []).includes(k))) {
        showToast('Pilih minimal satu kelas yang diampu dosen pada mata kuliah tersebut.', 'error');
        $('np-c-kelas-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      taskStudents = getFilteredStudentsForLecturer(course, angkatan, kelasList, supervisorNip || lecturerNip);
      if (!isGroup && isLecturer && !taskStudents.length) {
        showToast('Belum ada akun mahasiswa aktif yang cocok dengan mata kuliah, angkatan, dan kelas ini. Periksa data akun mahasiswa terlebih dahulu.', 'warn');
        return;
      }
      if (isStudent && !isGroup && !isStudentInCourseScope({ category: COURSE_CATEGORY, angkatan, kelas: kelasList, course }, SEED.student.nim)) {
        showToast('Angkatan dan kelas proyek harus mencakup data akademik Anda.', 'error');
        return;
      }
    }

    if (category === COURSE_CATEGORY && isStudent && isGroup) {
      const configuredGroupCount = Number.parseInt($('np-groupcount')?.value, 10) || 0;
      if (configuredGroupCount < 1) {
        showToast('Untuk proyek berkelompok, tentukan minimal satu kelompok.', 'error');
        $('np-groupcount')?.focus();
        return;
      }
    }

    const rawSlots = valueOf('np-slots');
    const slots = rawSlots === '' ? 0 : Number(rawSlots);
    if (category !== COURSE_CATEGORY && category !== COMMUNITY_CATEGORY && (!Number.isInteger(slots) || slots < 1 || slots > 40)) {
      showToast('Jumlah anggota yang dibutuhkan wajib berupa bilangan bulat 1–40; nilai 0 tidak diperbolehkan.', 'error');
      $('np-slots')?.focus();
      return;
    }
    if (category !== COURSE_CATEGORY && category !== COMMUNITY_CATEGORY && isGroup && slots > 0) {
      const { count, per } = currentGroupConfig();
      if (count > 0 && count * per < slots) {
        showToast(`Kapasitas kelompok baru ${count * per} orang, lebih kecil dari kuota total ${slots}. Tambah jumlah kelompok atau anggota per kelompok.`, 'error');
        $('np-groupcount')?.focus();
        return;
      }
    }

    const newId = editingProject ? editingProject.id : nextProjectId();
    const previousAttachmentId = editingProject?.attachment?.id || null;
    const memberApprovedFlag = !isStudent;
    const individualCourse = category === COURSE_CATEGORY && !isGroup && !isStudent;
    // Simpan lampiran setelah semua validasi peran, cakupan kelas, dan anggota lolos.
    let attachmentFileId = null;
    const baseProject = {
      id: newId,
      title,
      category,
      course,
      creator: isLecturer ? lecturerName : SEED.student.name,
      creatorNim: isLecturer ? lecturerNip : SEED.student.nim,
      ...(isLecturer ? { creatorNip: lecturerNip } : {}),
      creatorRole: isLecturer ? 'Dosen Pengampu' : 'Ketua Tim Mahasiswa',
      creatorAngkatan: isStudent ? currentStudentCohort() : '',
      supervisor: supervisorName,
      supervisorNip,
      department: isLecturer ? (lecturer.prodi || SEED.lecturer.prodi) : SEED.student.prodi,
      mitra,
      lokasi,
      period,
      membersNeeded: category === COURSE_CATEGORY
        ? Math.max(1, individualCourse ? taskStudents.length : (isGroup ? groupsMemberCountFromCurrentForm() : 1))
        : category === COMMUNITY_CATEGORY
          ? Math.max(1, isGroup ? selectedGroupMemberCountFromForm() : 1)
          : slots,
      description,
      requirements,
      status: isStudent && editingProject ? 'Diajukan' : isLecturer ? ((category === COURSE_CATEGORY || category === COMMUNITY_CATEGORY) ? STATUS_ACTIVE : 'Open') : 'Diajukan',
      angkatan: category === COURSE_CATEGORY ? angkatan : '',
      kelas: category === COURSE_CATEGORY ? kelasList : [],
      ...(isStudent && category === COURSE_CATEGORY ? { studentCreated: true } : {}),
      attachment: file ? { id: attachmentFileId, name: file.name, size: Math.ceil(file.size / 1024) + ' KB' } : (editingProject?.attachment || null)
    };

    let newProject;
    if (isGroup || individualCourse) {
      let groupsFromDom = isGroup ? collectGroupsFromDOM() : [];
      let perGroup = Math.max(1, Math.min(20, Number.parseInt($('np-pergroup')?.value, 10) || 1));
      if (isStudent || isLecturer || category === COMMUNITY_CATEGORY) {
        const allowed = new Set(newProjectStudentPool().map(student => String(student.nim)));
        const invalidMember = groupsFromDom.flatMap(group => group.members || []).find(member => !allowed.has(String(member.nim)));
        if (invalidMember) {
          const message = category === COURSE_CATEGORY
            ? `${invalidMember.name} tidak sesuai dengan mata kuliah, angkatan, atau kelas yang dipilih.`
            : category === COMMUNITY_CATEGORY
              ? `${invalidMember.name} tidak tercatat mengambil mata kuliah Informatika Untuk Masyarakat.`
              : isLecturer
                ? `${invalidMember.name} tidak mengambil mata kuliah yang diampu dosen pembuat proyek atau tidak memiliki data enrolmen yang valid.`
                : `${invalidMember.name} bukan mahasiswa aktif dari angkatan Anda atau akunnya tidak dikelola Admin.`;
          showToast(message, 'error');
          return;
        }
      }
      if (isGroup) {
        const overQuota = groupsFromDom.find(g => (g.members || []).length > perGroup);
        if (overQuota) {
          showToast(`"${overQuota.name}" melebihi kuota ${perGroup} anggota.`, 'error');
          return;
        }
        const selectedTotal = groupsFromDom.reduce((sum, group) => sum + (group.members || []).length, 0);
        // Proyek Mata Kuliah dan IUM tidak memiliki kuota anggota total.
        // Batas kapasitas untuk keduanya hanya berlaku per kelompok (membersPerGroup).
        if (![COURSE_CATEGORY, COMMUNITY_CATEGORY].includes(category) && slots > 0 && selectedTotal > slots) {
          showToast(`Anggota yang sudah dipilih berjumlah ${selectedTotal}, melebihi kuota total ${slots} orang.`, 'error');
          return;
        }
        if (category === COURSE_CATEGORY) {
          const scopeRef = { category: COURSE_CATEGORY, angkatan, kelas: kelasList, course };
          const outside = groupsFromDom.flatMap(g => g.members || []).find(m => !isStudentInCourseScope(scopeRef, m.nim));
          if (outside) {
            showToast(`${outside.name} berada di luar mata kuliah, angkatan, atau kelas yang ditentukan.`, 'error');
            return;
          }
        }
      }

      let groups;
      if (individualCourse) {
        // Each student receives an independent document trail and grade, using the existing group-work model internally.
        groups = taskStudents.map(student => buildGroup(`Individu — ${student.name}`, [{
          nim: student.nim, name: student.name, prodi: student.prodi,
          role: 'Mahasiswa', approved: true
        }]));
      } else {
        groups = groupsFromDom.map(g => ({
          id: uid('GRP'),
          name: g.name,
          members: (g.members || []).map(m => ({ ...m, approved: memberApprovedFlag })),
          milestones: [],
          guidance: []
        }));
        const count = Math.max(0, Math.min(20, Number.parseInt($('np-groupcount')?.value, 10) || 0));
        while (groups.length < count) groups.push(buildGroup(`Kelompok ${groups.length + 1}`, []));
      }

      newProject = Object.assign(baseProject, {
        isGroup: true,
        individualCourse,
        groups,
        groupCount: groups.length,
        membersPerGroup: individualCourse ? 1 : perGroup,
        members: [],
        applicants: [],
        milestones: [],
        guidance: []
      });
    } else {
      let members = [];
      if (isStudent) {
        members = [{ nim: SEED.student.nim, name: SEED.student.name, prodi: SEED.student.prodi, role: 'Ketua Tim', approved: false }];
      }
      newProject = Object.assign(baseProject, {
        isGroup: false,
        individualCourse: false,
        groups: [],
        groupCount: 0,
        membersPerGroup: 0,
        members,
        applicants: [],
        milestones: [],
        guidance: []
      });
    }

    if (file) {
      try {
        attachmentFileId = await storeUploadedDocument(file, { purpose: 'project-attachment', projectId: newId });
        if (newProject.attachment) newProject.attachment.id = attachmentFileId;
      } catch (documentError) {
        console.error('KREASI: lampiran proyek gagal disimpan', documentError);
        showToast('Dokumen pendukung tidak dapat disimpan pada browser ini. Coba lagi melalui browser terbaru atau tanpa lampiran.', 'error');
        return;
      }
    }

    let editingIndex = -1;
    if (editingProject) {
      editingIndex = db.projects.findIndex(project => project.id === editingProject.id);
      if (editingIndex < 0) { showToast('Usulan yang diedit tidak lagi ditemukan.', 'error'); return; }
      // Pertahankan metadata pembuatan lama, tetapi ganti field formulir dan struktur anggota.
      newProject = { ...editingProject, ...newProject, id: editingProject.id, status: 'Diajukan' };
      if (category !== COURSE_CATEGORY) delete newProject.studentCreated;
      delete newProject.ownerNip; delete newProject.ownerName; delete newProject.ownedAt;
      db.projects[editingIndex] = newProject;
    } else {
      db.projects.unshift(newProject);
    }
    normalizeProject(newProject);
    if (!saveDB()) {
      if (editingProject && editingIndex >= 0) db.projects[editingIndex] = editingProject;
      else db.projects = db.projects.filter(project => project.id !== newId);
      if (attachmentFileId) { try { await removeStoredDocument(attachmentFileId); } catch (_) {} }
      return;
    }
    if (file && previousAttachmentId && previousAttachmentId !== attachmentFileId) {
      try { await removeStoredDocument(previousAttachmentId); } catch (err) { console.warn('Lampiran lama tidak dapat dihapus:', err); }
    }

    closeModal();
    render();
    if (editingProject) {
      showToast('Usulan proyek berhasil diperbarui dan tetap menunggu persetujuan dosen.', 'success');
      return;
    }
    if (category === COURSE_CATEGORY && individualCourse) {
      showToast(`Tugas individu berhasil dibuat untuk ${taskStudents.length} mahasiswa. Dokumentasi dan nilai tiap mahasiswa terpisah.`, 'success');
    } else if (category === COURSE_CATEGORY && isStudent) {
      showToast('Proyek mata kuliah dikirim ke dosen pengampu untuk ditinjau.', 'success');
    } else if (category === COURSE_CATEGORY && isGroup) {
      showToast('Proyek Mata Kuliah berhasil dibuat.', 'success');
    } else {
      showToast(
        isGroup ? (isLecturer ? 'Proyek berkelompok berhasil dipublikasikan.' : 'Usulan proyek berkelompok berhasil dikirim untuk ditinjau dosen.') :
        (isLecturer ? 'Proyek berhasil dipublikasikan.' : 'Usulan proyek berhasil dikirim untuk ditinjau dosen.'),
        'success'
      );
    }
  } catch (err) {
    console.error('KREASI: gagal membuat proyek', err);
    showToast('Proyek gagal dibuat karena terjadi kesalahan. Periksa isian, lalu coba kembali.', 'error');
  }
}

function openStudentProject(id, groupId) {
  state.studentProjectId = id;
  state.studentGroupId = groupId || null;
  state.activeStudentMenu = 'myprojects';
  render();
  window.scrollTo({ top: 0 });
}

function studentProjectWorkspace(id, groupId) {
  const p = getProject(id);
  if (!p || !canViewProject(p, 'student', SEED.student)) { state.studentProjectId = null; state.studentGroupId = null; return studentMyProjects(); }

  const isGroup = isGroupProject(p);
  const isIndividualCourse = isIndividualCourseProject(p);
  const myGroup = isGroup ? findGroupByStudent(p, SEED.student.nim) : null;
  let activeGroup = null;
  if (isGroup) {
    if (isIndividualCourse) {
      if (!myGroup) {
        showToast('Tugas ini tidak ditujukan untuk akun mahasiswa Anda.', 'error');
        state.studentProjectId = null; state.studentGroupId = null;
        return studentMyProjects();
      }
      // Do not permit a student to open another student's individual submission by changing a group ID.
      activeGroup = myGroup;
      state.studentGroupId = myGroup.id;
    } else if (myGroup) {
      // Anggota hanya dapat membuka kelompoknya sendiri, walau groupId diubah secara manual.
      activeGroup = myGroup;
      state.studentGroupId = myGroup.id;
    } else {
      // Mahasiswa yang belum menjadi anggota boleh memilih kelompok terbuka untuk mengajukan keanggotaan,
      // tetapi bagian dokumentasi/penilaian kelompok tetap disembunyikan.
      activeGroup = groupId ? getGroup(p, groupId) : (p.groups[0] || null);
      if (!activeGroup && p.groups.length) activeGroup = p.groups[0];
      state.studentGroupId = activeGroup ? activeGroup.id : null;
    }
  }

  const canViewGroupDocs = !isGroup || !!myGroup;
  const activeGroupLabel = projectWorkUnitLabel(p, activeGroup);
  const activeMilestones = isGroup ? (activeGroup && canViewGroupDocs ? activeGroup.milestones : []) : p.milestones;
  const activeGuidance = isGroup ? (activeGroup && canViewGroupDocs ? activeGroup.guidance : []) : (p.guidance || []);
  const progress = isGroup && activeGroup ? (canViewGroupDocs ? groupProgress(activeGroup) : { done: 0, total: 0, pct: 0 }) : projectProgress(p);

  const isPendingProject = p.status === 'Diajukan';

  const groupTabs = isGroup && !isIndividualCourse && !myGroup && (p.groups || []).length ? `
  <div class="mb-4 p-3 rounded-xl border border-slate-200 bg-white">
    <p class="text-2xs text-slate-500 mb-2">Pilih kelompok yang ingin Anda ajukan. Dokumentasi kelompok hanya dapat dilihat anggotanya.</p>
    <div class="flex flex-wrap gap-2">
    ${p.groups.map(g => `
      <button onclick="switchStudentGroup('${p.id}','${g.id}')" class="group-tab ${activeGroup && activeGroup.id === g.id ? 'active' : ''}">
        <i class="fa-solid fa-people-group mr-1"></i>${esc(g.name)}
        <span class="ml-1 text-[9px] opacity-80">· ${g.members.length}/${groupCapacity(p)} org</span>
      </button>`).join('')}
    </div>
  </div>` : '';

  const pendingBanner = isPendingProject ? `
    <div class="mb-5 p-4 rounded-2xl border border-violet-200 bg-violet-50 flex items-start gap-3">
      <i class="fa-solid fa-hourglass-half text-violet-700 mt-0.5" aria-hidden="true"></i>
      <div class="min-w-0">
        <p class="text-xs font-bold text-violet-900">Usulan proyek menunggu persetujuan dosen</p>
        <p class="text-2xs text-violet-800 mt-1">Dosen pembimbing akan menyetujui/menolak proyek. Tahapan dokumentasi dapat diunggah setelah proyek disetujui.</p>
      </div>
    </div>` : '';

  const gradable = isGradableCategory(p) && canViewGroupDocs;
  const gradeTarget = isGroup && activeGroup ? activeGroup : p;
  const gradingMode = getProjectGradingMode(p);
  const currentStudentMember = (isGroup && activeGroup ? (activeGroup.members || []) : (p.members || []))
    .find(m => String(m.nim) === String(SEED.student.nim));
  const groupGrade = getGrade(gradeTarget);
  const individualGrade = currentStudentMember?.grade || null;
  const showGroupGrade = gradingMode === 'group' || gradingMode === 'both';
  const showIndividualGrade = gradingMode === 'individual' || gradingMode === 'both';
  const allStagesApproved = isDocumentationComplete(gradeTarget);
  const canGrade = allStagesApproved && (!!gradeTarget.completionConfirmed || !!groupGrade || !!individualGrade);
  const gradeResultCard = (label, grade) => `
    <div class="rounded-2xl border border-slate-200 bg-white p-5">
      <div class="flex items-center justify-between gap-3 mb-2"><h3 class="text-xs font-extrabold text-slate-800">${label}</h3>${grade ? '' : '<span class="badge badge-neutral">Belum Dinilai</span>'}</div>
      ${grade ? `<div class="flex items-center gap-4"><div class="grade-badge text-2xl">${esc(grade.letter)}</div><div class="min-w-0"><p class="text-2xl font-extrabold text-slate-900">${grade.score}<span class="text-sm font-semibold text-slate-500"> / 100</span></p><p class="text-2xs text-slate-500 mt-1">Dinilai oleh <strong>${esc(grade.gradedBy || 'Dosen Pembimbing')}</strong> pada ${esc(grade.gradedAt || '-')}</p></div></div>${grade.note ? `<p class="text-2xs text-slate-600 mt-3 italic leading-relaxed">“${esc(grade.note)}”</p>` : ''}` : '<p class="text-2xs text-slate-500">Dosen belum menyimpan nilai ini.</p>'}
    </div>`;
  const gradePanel = gradable ? `
    <section class="grade-panel p-6 mt-5">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div>
          <h2 class="text-sm font-extrabold text-slate-900"><i class="fa-solid fa-clipboard-check text-violet-600 mr-1.5" aria-hidden="true"></i>${gradingMode === 'both' ? 'Penilaian Akhir Kelompok dan Individu' : gradingMode === 'individual' ? 'Penilaian Akhir Individu' : `Penilaian Akhir ${isGroup && activeGroup ? `— ${esc(activeGroupLabel)}` : ''}`}</h2>
          <p class="text-2xs text-slate-500 mt-1">${canGrade ? 'Berikut hasil penilaian yang diberikan dosen.' : 'Nilai akhir dapat dilihat setelah seluruh tahapan disetujui dan dokumentasi ditandai selesai oleh dosen.'}</p>

      </div>
      <div class="grid ${showGroupGrade && showIndividualGrade ? 'md:grid-cols-2' : 'grid-cols-1'} gap-3">
        ${showGroupGrade ? gradeResultCard('Nilai Kelompok', groupGrade) : ''}
        ${showIndividualGrade ? gradeResultCard('Nilai Individu Anda', individualGrade) : ''}
      </div>
      ${!canGrade ? `<p class="text-2xs text-slate-500 mt-3">Progress dokumentasi: ${progress.done}/${progress.total} tahapan disetujui.</p>` : ''}
    </section>` : '';
  const proposeCheck = isGroup && activeGroup ? canProposeMemberToGroup(p, activeGroup, SEED.student.nim) : { ok: false };
  const canProposeMembers = !!proposeCheck.ok;
  const isMemberOfActive = isGroup ? !!(activeGroup && activeGroup.members.some(m => String(m.nim) === String(SEED.student.nim) && m.approved !== false)) : true;
  const proposalBanner = (!isIndividualCourse && isGroup && activeGroup && isCourseProject(p) && p.status === STATUS_ACTIVE) ? (
    canProposeMembers ? `
    <div class="mb-5 p-4 rounded-2xl border border-violet-200 bg-violet-50 flex items-start gap-3">
      <i class="fa-solid fa-user-plus text-violet-700 mt-0.5" aria-hidden="true"></i>
      <div class="min-w-0 flex-1">
        <p class="text-xs font-bold text-violet-900">${esc(activeGroupLabel)} belum lengkap (${activeGroup.members.length}/${groupCapacity(p)} anggota)</p>
      </div>
      <button onclick="openProposeMemberModal('${p.id}','${activeGroup.id}')" class="btn btn-primary btn-sm shrink-0"><i class="fa-solid fa-user-plus" aria-hidden="true"></i> Ajukan Anggota</button>
    </div>` : proposeCheck.full ? '' : `
    <div class="mb-5 p-4 rounded-2xl border border-slate-200 bg-slate-50 flex items-start gap-3">
      <i class="fa-solid ${proposeCheck.full ? 'fa-circle-check text-violet-600' : 'fa-lock text-slate-500'} mt-0.5" aria-hidden="true"></i>
      <p class="text-2xs text-slate-700 min-w-0">${esc(proposeCheck.message || '')}</p>
    </div>`
  ) : '';
  const proposeMemberButton = canProposeMembers ? `
    <button onclick="openProposeMemberModal('${p.id}','${activeGroup.id}')" class="btn btn-secondary btn-sm">
      <i class="fa-solid fa-user-plus" aria-hidden="true"></i> Ajukan Anggota
    </button>` : '';

  return `
  <nav class="mb-5 text-2xs text-slate-500 pt-2" aria-label="Breadcrumb">
    <button onclick="backToMyProjects()" class="font-semibold hover:text-violet-700 transition inline-flex items-center gap-1.5">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Semua proyek saya
    </button>
    <span class="mx-2 text-slate-300">/</span>
    <span class="text-slate-700 font-semibold truncate">${esc(p.title)}</span>
    ${isGroup && activeGroup ? `<span class="mx-2 text-slate-300">/</span><span class="text-violet-700 font-bold truncate">${esc(activeGroupLabel)}</span>` : ''}
  </nav>

  ${pageTitle(
      isIndividualCourse ? 'RUANG KERJA TUGAS INDIVIDU' : isGroup ? 'SUB PROYEK — DOKUMENTASI KELOMPOK' : 'RUANG KERJA PROYEK',
      p.title,
      `${p.category} · ${p.id} · ${p.period}${isGroup && activeGroup ? ` · <span class="text-violet-700 font-bold">${esc(activeGroupLabel)}</span>` : ''}`,
      `${proposeMemberButton}`
  )}

  ${pendingBanner}
  ${proposalBanner}
  ${groupTabs}

  <div class="grid lg:grid-cols-3 gap-5">
    <div class="lg:col-span-1 space-y-5">

async function submitMilestone(e, projectId, key, groupId) {
  if (e && typeof e.preventDefault === 'function') e.preventDefault();
  try {
    const p = getProject(projectId);
    if (!p) { showToast('Proyek tidak ditemukan.', 'error'); return; }
    const group = groupId ? getGroup(p, groupId) : null;
    if (groupId && (!group || !group.members.some(x => String(x.nim) === String(SEED.student.nim) && x.approved !== false))) {
      showToast('Hanya anggota kelompok ini yang dapat mengunggah dokumen.', 'error');
      return;
    }
    const m = groupId ? getGroupMilestone(group, key) : getMilestone(p, key);
    if (!m) { showToast('Tahapan dokumentasi tidak ditemukan.', 'error'); return; }
    if (!['Belum Dimulai', 'Revisi'].includes(m.status)) {
      showToast('Tahapan ini tidak sedang menerima unggahan baru.', 'warn');
      return;
    }
    const file = $('ms-file')?.files?.[0] || null;
    if (!file) { showToast('Pilih berkas yang akan dikirim.', 'error'); $('ms-file')?.focus(); return; }
    if (file.size > 10 * 1024 * 1024) { showToast('Ukuran dokumen maksimal 10 MB.', 'error'); return; }
    if (!/\.(pdf|docx|xlsx|zip)$/i.test(file.name)) {
      showToast('Format dokumen harus PDF, DOCX, XLSX, atau ZIP.', 'error');
      return;
    }

    const fileId = await storeUploadedDocument(file, {
      purpose: 'milestone', projectId, groupId: groupId || null, milestoneKey: key
    });
    const previous = { ...m };
    if (m.status === 'Revisi') m.revisionCount = (m.revisionCount || 0) + 1;
    m.fileId = fileId;
    m.fileName = file.name;
    m.fileType = file.type || 'application/octet-stream';
    m.fileSize = file.size;
    m.submittedAt = todayShort();
    m.note = ($('ms-note')?.value || '').trim();
    m.status = 'Menunggu Verifikasi';
    m.reviewNote = '';
    m.verifiedBy = '';
    m.verifiedAt = '';

    const scope = groupId ? group.name : p.title;
    pushNotif('Dokumen diunggah', `${m.name} pada "${scope}" menunggu verifikasi dosen.`);
    if (!saveDB()) {
      Object.keys(m).forEach(k => delete m[k]);
      Object.assign(m, previous);
      try { await removeStoredDocument(fileId); } catch (_) {}
      return;
    }
    if (previous.fileId && previous.fileId !== fileId) {
      try { await removeStoredDocument(previous.fileId); } catch (cleanupError) { console.warn('Berkas revisi lama belum berhasil dibersihkan.', cleanupError); }
    }
    closeModal(); render();
    showToast(`Dokumen "${m.name}" berhasil diunggah dan siap diverifikasi.`, 'success');
  } catch (err) {
    console.error('KREASI: unggah dokumen gagal', err);
    showToast('Dokumen gagal disimpan. Periksa koneksi penyimpanan browser dan coba kembali.', 'error');
  }
}

function submitProposeMember(e, projectId, groupId) {
  e.preventDefault();
  const p = getProject(projectId);
  const group = groupId ? getGroup(p, groupId) : null;
  if (!p || !group) return;

  // Validasi ulang saat kirim: kelompok harus masih belum lengkap & pengusul berhak
  const chk = canProposeMemberToGroup(p, group, SEED.student.nim);
  if (!chk.ok) { showToast(chk.message, 'warn'); closeModal(); render(); return; }

  const select = $('pm-member');
  const nim = select.value;
  const selectedOption = select.options[select.selectedIndex];
  const name = selectedOption.getAttribute('data-name');
  const prodi = selectedOption.getAttribute('data-prodi');
  const role = $('pm-role').value;

  if (!nim || !name) { showToast('Pilih mahasiswa yang valid.', 'error'); return; }
  if (isProjectAtCapacity(p)) { showToast('Kuota total anggota proyek sudah penuh.', 'warn'); return; }

  if (allMembersOf(p).some(m => m.nim === nim)) {
    showToast('Mahasiswa tersebut sudah tergabung atau sudah diusulkan di kelompok pada proyek ini.', 'warn');
    return;
  }
  if (!isProjectMemberCandidateAllowed(p, nim)) {
    showToast(p.category === COURSE_CATEGORY
      ? 'Mahasiswa bukan dari angkatan, kelas, atau mata kuliah yang ditentukan dosen.'
      : 'Mahasiswa harus berasal dari angkatan pembuat proyek dan memiliki akun aktif yang dikelola Admin.', 'error');
    return;
  }

  group.members.push({
    nim, name, prodi, role,
    approved: false,
    proposedBy: SEED.student.nim,
    proposedByName: SEED.student.name
  });

  pushNotif('Pengajuan anggota baru', `${SEED.student.name} mengusulkan ${name} masuk ke kelompok "${group.name}" pada proyek "${p.title}".`);
  saveDB(); closeModal(); render();
  showToast(`Anggota ${name} berhasil diajukan dan menunggu persetujuan dosen.`, 'success');
}

function skpiContentForStudent(s, approved, mexs) {
  approved = [...approved].sort((x, y) => y.points - x.points).slice(0, 10);
  const safeMexs = (typeof mexs === 'number' && !isNaN(mexs)) ? mexs : 0;
  const pred = safeMexs >= 2801 ? 'Istimewa' : safeMexs >= 2301 ? 'Baik Sekali' : safeMexs >= 1801 ? 'Baik' : safeMexs >= 1300 ? 'Cukup' : safeMexs >= 1000 ? 'Memenuhi Standar Minimal' : 'Belum Memenuhi (min. 1000 poin S1)';
  const H = t => `<div style="font-weight:bold;font-size:12px;margin:14px 0 6px;">${t}</div>`;
  return `

    </table>

    ${H('INFORMASI CAPAIAN KEGIATAN EKSTRAKURIKULER (MEXS)')}
    <p style="font-size:11px;margin-bottom:6px;">Berdasarkan Mulawarman Extracurricular System (MEXS), mahasiswa tercatat memiliki capaian sebagai berikut (maksimal 10 prestasi):</p>

    <table style="width:100%;border-collapse:collapse;font-size:11px;">

          <th style="border:1px solid #64748b;padding:6px;text-align:center;width:34px;">No</th>
          <th style="border:1px solid #64748b;padding:6px;text-align:left;">Nama Kegiatan / Prestasi</th>
          <th style="border:1px solid #64748b;padding:6px;text-align:left;">Kategori</th>

          <th style="border:1px solid #64748b;padding:6px;text-align:center;width:46px;">Poin</th>
        </tr>
      </thead>
      <tbody>
        ${approved.length ? approved.map((a, i) => `

            <td style="border:1px solid #64748b;padding:6px;text-align:center;">${a.points}</td>
          </tr>`).join('') : `<tr><td colspan="5" style="border:1px solid #64748b;padding:12px;text-align:center;">Belum ada prestasi tervalidasi.</td></tr>`}

        <div style="font-weight:bold;text-decoration:underline;">Dr. Rudi Hartono, S.T., M.Eng.</div>
        <div>NIP. 199005202012011003</div>
      </div>

}

function printSkpi(nim) {
  if (state.userRole !== 'admin') {
    showToast('Pencetakan SKPI hanya tersedia untuk administrator.', 'error');
    return;
  }
  const targetNim = String(nim || '');
  if (!targetNim) { showToast('Mahasiswa yang akan dicetak SKPI-nya belum dipilih.', 'warn'); return; }
  if (!isFinalized(targetNim)) { showToast('SKPI hanya dapat dicetak setelah finalisasi disetujui administrator.', 'warn'); return; }
  const talent = db.talentPool.find(item => String(item.nim) === targetNim);
  if (!talent) { showToast('Data mahasiswa tidak ditemukan.', 'error'); return; }
  const account = db.users.find(item => item.role === 'student' && String(item.nim) === targetNim) || {};
  const student = { ...talent, ...account, nim: targetNim };
  const approved = achievementsForStudent(targetNim).filter(a => a.status === 'Disetujui');
  const mexs = mexsPoints(targetNim);
  printDocument(`
  <div class="doc-serif" style="font-size:12px;line-height:1.6;">
    ${skpiContentForStudent(student, approved, mexs)}
  </div>`);
}

function renderLecturerContent() {
  switch (state.activeLecturerMenu) {
    case 'dashboard':     return lecturerDashboard();
    case 'profile':       return lecturerProfile();

    case 'projects':      return state.lecturerProjectId
      ? lecturerProjectDocumentation(state.lecturerProjectId, state.lecturerGroupId)

      return state.lecturerProjectId
        ? lecturerProjectDocumentation(state.lecturerProjectId, state.lecturerGroupId)

  const list = db.achievements || [];
  const pending = list.filter(a => a.status === 'Menunggu Validasi');
  const history = list.filter(a => a.status !== 'Menunggu Validasi');
  const approvedCount = list.filter(a => a.status === 'Disetujui').length;
  const rejectedCount = list.filter(a => a.status === 'Ditolak').length;
  const renderRows = (items, emptyMessage) => items.length ? items.map(a => `
    <tr data-search="${esc(a.title)} ${esc(a.category)} ${esc(a.organizer)} ${esc(a.nim || '')}">
      <td>
        <p class="font-semibold text-slate-800 leading-snug">${esc(a.title)}</p>

      </td>
      <td><span class="text-2xs font-semibold text-slate-600">${esc(a.category)}</span></td>
      <td><span class="font-bold text-slate-800">${Number(a.points) || 0}</span></td>
      <td>${badge(a.status)}</td>
      <td class="text-right whitespace-nowrap">
        <button onclick="openAdminAchievementModal('${esc(a.id)}')" class="text-2xs font-bold text-violet-700 hover:underline">
          ${a.status === 'Menunggu Validasi' ? 'Periksa' : 'Detail'}
        </button>
      </td>
    </tr>`).join('') : `
    <tr><td colspan="5" class="text-center text-xs text-slate-500 py-8">${emptyMessage}</td></tr>`;
  const renderSection = (title, description, items, emptyMessage) => `
    <section class="dash-card overflow-hidden mb-5">
      <div class="px-6 py-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 class="text-sm font-extrabold text-slate-900">${title}</h2>
          <p class="text-2xs text-slate-500 mt-1">${description}</p>
        </div>
        <span class="badge ${title === 'Menunggu Validasi' ? 'badge-warning' : 'badge-neutral'}">${items.length} data</span>
      </div>
      <div class="overflow-x-auto scroll-thin-light">
        <table class="tbl">
          <caption class="sr-only">${title}</caption>
          <thead><tr>
            <th scope="col">Prestasi</th><th scope="col">Kategori</th><th scope="col">Poin</th>
            <th scope="col">Status</th><th scope="col" class="text-right">Tindakan</th>
          </tr></thead>
          <tbody>${renderRows(items, emptyMessage)}</tbody>
        </table>
      </div>
    </section>`;

  return `
  ${pageTitle('VALIDASI PRESTASI MAHASISWA', 'Pengajuan Prestasi & Poin MEXS',
      `${pending.length} pengajuan menunggu validasi; ${approvedCount} disetujui dan ${rejectedCount} ditolak.`)}

  <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
    ${dashStat('fa-hourglass-half', pending.length, 'Menunggu Validasi')}
    ${dashStat('fa-circle-check', approvedCount, 'Disetujui')}
    ${dashStat('fa-circle-xmark', rejectedCount, 'Ditolak')}
  </div>

  ${renderSection('Menunggu Validasi', 'Pengajuan yang perlu diperiksa admin ditampilkan terlebih dahulu.', pending, 'Tidak ada prestasi yang menunggu validasi.')}
  ${renderSection('Riwayat Validasi', 'Riwayat prestasi yang sudah diputuskan, termasuk yang disetujui dan ditolak.', history, 'Belum ada riwayat validasi prestasi.')}
  <div id="search-empty" class="hidden px-6 py-4 text-xs text-slate-500 border-t border-slate-100">Tidak ada data yang cocok dengan pencarian.</div>`;
}

          <label class="lbl" for="val-decision">Keputusan Validasi</label>

        ${a.note ? `<p class="text-2xs text-violet-800 mt-1.5 leading-relaxed">${esc(a.note)}</p>` : ''}
      </div>`}
    </div>`,
    footer: !isPending ? `<button onclick="closeModal()" class="btn btn-primary">Tutup</button>` : ''
  });
}

function submitAchievementValidation(e, id) {
  e.preventDefault();
  if (state.userRole !== 'admin') { showToast('Hanya Admin yang dapat memvalidasi prestasi.', 'error'); return; }
  const a = db.achievements.find(x => x.id === id);
  if (!a) return;
  const decision = $('val-decision').value;
  const note = $('val-note').value.trim();

  a.status = decision;
  a.validatedBy = SEED.admin.name;
  a.validatedAt = todayShort();
  a.note = note || (decision === 'Disetujui'
    ? 'Dokumen valid, prestasi tercatat pada rekam jejak mahasiswa.'
    : 'Dokumen tidak memenuhi ketentuan.');

  syncTalentPoolRecord(a.nim || LEGACY_DEMO_STUDENT_NIM);
  pushNotif(
    decision === 'Disetujui' ? 'Prestasi disetujui' : 'Prestasi ditolak',
    `${a.title} — ${decision.toLowerCase()} oleh ${SEED.admin.name}.`
  );

  saveDB(); closeModal(); render();
  showToast(`Prestasi berhasil ${decision.toLowerCase()}.`, decision === 'Disetujui' ? 'success' : 'error');
}

  const p = getProject(id);
  if (!p) { state.lecturerProjectId = null; state.lecturerGroupId = null; return lecturerProjects(); }
  const isGroup = isGroupProject(p);
  const isIndividualCourse = isIndividualCourseProject(p);
  let activeGroup = null;
  if (isGroup) activeGroup = groupId ? getGroup(p, groupId) : (p.groups[0] || null);
  const activeGroupLabel = projectWorkUnitLabel(p, activeGroup);
  const activeMilestones = isGroup ? (activeGroup ? activeGroup.milestones : []) : p.milestones;
  const activeGuidance = isGroup ? (activeGroup ? activeGroup.guidance : []) : (p.guidance || []);
  const progress = isGroup && activeGroup ? groupProgress(activeGroup) : projectProgress(p);

  const pendingMembers = countPendingMembers(p);

  const groupTabs = isGroup && (p.groups || []).length ? `
  <div class="flex flex-wrap gap-2 mb-5">
    ${p.groups.map(g => {
      const gp = groupProgress(g);
      return `

  const isMarkedComplete = !!gradeTarget.completionConfirmed;
  const canGrade = allStagesApproved && (isMarkedComplete || hasAnyGrade);
  const canApprove = canApproveProject(p, 'lecturer', SEED.lecturer);
  const allowGroupGrade = gradingMode === 'group' || gradingMode === 'both';
  const allowIndividualGrade = gradingMode === 'individual' || gradingMode === 'both';
  const groupGradeForm = `
        <form onsubmit="saveGrade(event,'${p.id}'${isGroup && activeGroup ? `,'${activeGroup.id}'` : ''})" class="space-y-4 rounded-2xl border border-slate-200 p-4">

            <div class="flex-1 w-full"><label class="lbl" for="grade-score">Nilai Akhir Kelompok (0–100)</label><input id="grade-score" type="number" min="0" max="100" class="inp" required value="${targetGrade ? targetGrade.score : ''}" placeholder="mis. 85" oninput="updateGradePreview(this.value)"><p class="hint">Nilai yang disimpan berlaku bagi kelompok ini.</p></div>
          </div>
          <div><label class="lbl" for="grade-note">Catatan Penilaian Kelompok (opsional)</label><textarea id="grade-note" rows="3" class="inp" placeholder="Catatan atau umpan balik untuk kelompok...">${targetGrade ? esc(targetGrade.note || '') : ''}</textarea></div>
          <div class="flex justify-end gap-2">${targetGrade ? `<button type="button" onclick="clearGrade('${p.id}'${isGroup && activeGroup ? `,'${activeGroup.id}'` : ''})" class="btn btn-secondary text-rose-600"><i class="fa-solid fa-eraser" aria-hidden="true"></i> Hapus Nilai</button>` : ''}<button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> ${targetGrade ? 'Perbarui Nilai Kelompok' : 'Simpan Nilai Kelompok'}</button></div>
        </form>`;
  const individualGradeForms = `
        <div class="space-y-3">
          <h3 class="text-xs font-extrabold text-slate-800">Nilai Individu</h3>
          ${membersForGrade.length ? membersForGrade.map((member, index) => {
            const g = member.grade || null;
            return `<form onsubmit="saveIndividualGrade(event,'${p.id}'${isGroup && activeGroup ? `,'${activeGroup.id}'` : ',null'},${index})" class="p-4 rounded-2xl bg-white border border-slate-200 space-y-3">
              <div class="flex items-center justify-between gap-3"><div><p class="text-xs font-extrabold text-slate-900">${esc(member.name || member.nim || `Mahasiswa ${index+1}`)}</p><p class="text-2xs text-slate-500 mt-0.5">${esc(member.nim || '')} · ${esc(member.role || 'Mahasiswa')}</p></div>${member.approved === false ? `<span class="badge badge-warning">Menunggu Persetujuan</span>` : g ? `<span class="badge badge-success">Nilai ${g.letter} · ${g.score}</span>` : `<span class="badge badge-neutral">Belum Dinilai</span>`}</div>

          <p class="text-2xs text-slate-500 mt-1">${isMarkedComplete ? `Ditandai oleh ${esc(gradeTarget.completedBy || SEED.lecturer.name)} pada ${esc(gradeTarget.completedAt || '-')}.` : `${groupProgress(gradeTarget).done}/${groupProgress(gradeTarget).total} tahap disetujui.`}</p></div>

/* -------- PENYIMPANAN NILAI (GRADING) -------- */
function updateGradePreview(val) {
  const letter = scoreToLetter(parseInt(val, 10) || 0);
  const preview = $('grade-letter-preview');
  if (preview) preview.textContent = letter;
}
function saveGrade(e, projectId, groupId) {
  e.preventDefault();
  const p = getProject(projectId);
  if (!p) return;
  const target = groupId ? getGroup(p, groupId) : p;
  if (!target) return;
  if (!canGradeProject(p, 'lecturer', SEED.lecturer)) {
    showToast('Anda tidak berwenang memberi nilai pada proyek ini.', 'error');
    return;
  }
  // Nilai hanya dapat diberikan setelah dosen menyetujui SELURUH tahapan dokumentasi
  const ready = groupId ? isGroupFullyApproved(target) : isProjectFullyApproved(p);
  if (!ready || (!target.completionConfirmed && !target.grade)) {
    showToast('Nilai belum dapat diberikan. Setujui seluruh tahapan, lalu klik “Tandai Seluruh Tahapan Selesai”.', 'error');
    return;
  }
  if (!['group','both'].includes(getProjectGradingMode(p))) {
    showToast('Mode penilaian tidak mengizinkan nilai kelompok.', 'warn');
    return;
  }
  if (groupId && !target.members.some(m => m.approved !== false)) {
    showToast('Kelompok ini belum memiliki anggota yang disetujui, sehingga belum dapat dinilai.', 'error');
    return;
  }
  const score = parseInt($('grade-score').value, 10);
  if (!Number.isFinite(score) || score < 0 || score > 100) {
    showToast('Nilai harus berupa angka antara 0 dan 100.', 'error');
    return;
  }
  const note = $('grade-note').value.trim();
  target.grade = {
    score,
    letter: scoreToLetter(score),
    note,
    gradedBy: SEED.lecturer.name,
    gradedAt: todayShort()
  };
  pushNotif('Nilai akhir diberikan', `Proyek "${p.title}"${groupId ? ` kelompok "${target.name}"` : ''} telah dinilai: ${score} (${target.grade.letter}).`);
  saveDB(); render();
  showToast(`Nilai akhir ${score} (${target.grade.letter}) berhasil disimpan.`, 'success');
}
function clearGrade(projectId, groupId) {
  const p = getProject(projectId);
  if (!p) return;
  const target = groupId ? getGroup(p, groupId) : p;
  if (target) delete target.grade;
  saveDB(); render();
  showToast('Nilai akhir dihapus.', 'info');
}

function saveIndividualGrade(e, projectId, groupId, memberIndex) {
  e.preventDefault();
  const p = getProject(projectId);
  if (!p || !canGradeProject(p, 'lecturer', SEED.lecturer)) { showToast('Anda tidak berwenang memberi nilai.', 'error'); return; }
  if (!['individual','both'].includes(getProjectGradingMode(p))) { showToast('Mode penilaian tidak mengizinkan nilai individu.', 'warn'); return; }
  const target = groupId ? getGroup(p, groupId) : p;
  const members = target ? (target.members || []) : [];
  const member = members[Number(memberIndex)];
  if (!target || !member || member.approved === false) { showToast('Mahasiswa tidak ditemukan atau belum disetujui sebagai anggota.', 'error'); return; }
  if (!isDocumentationComplete(target) || (!target.completionConfirmed && !target.grade)) {
    showToast('Tandai seluruh tahapan dokumentasi selesai sebelum memberikan nilai.', 'error'); return;
  }
  const scoreField = $('grade-score-ind-' + memberIndex);
  const noteField = $('grade-note-ind-' + memberIndex);
  const score = Number(scoreField?.value);
  if (!Number.isFinite(score) || score < 0 || score > 100) { showToast('Nilai harus berupa angka antara 0 dan 100.', 'error'); return; }
  member.grade = { score, letter:scoreToLetter(score), note:(noteField?.value || '').trim(), gradedBy:SEED.lecturer.name, gradedAt:todayShort() };
  pushNotif('Nilai individu diberikan', `Mahasiswa ${member.name} pada proyek “${p.title}” memperoleh nilai ${score} (${member.grade.letter}).`);
  if (!saveDB()) return;
  render(); showToast(`Nilai untuk ${member.name} berhasil disimpan.`, 'success');
}
function clearIndividualGrade(projectId, groupId, memberIndex) {
  const p = getProject(projectId);
  if (!p || !canGradeProject(p, 'lecturer', SEED.lecturer)) return;
  const target = groupId ? getGroup(p, groupId) : p;
  const member = target && (target.members || [])[Number(memberIndex)];
  if (!member || !member.grade) return;
  delete member.grade;
  if (!saveDB()) return;
  render(); showToast('Nilai individu dihapus.', 'info');
}

function submitMilestoneVerification(e, projectId, key, groupId) {
  e.preventDefault();
  const p = getProject(projectId);
  if (!canApproveProject(p, 'lecturer', SEED.lecturer)) {
    showToast('Anda tidak berwenang memverifikasi tahapan proyek ini.', 'error');
    closeModal();
    return;
  }
  const m = groupId ? getGroupMilestone(getGroup(p, groupId), key) : getMilestone(p, key);
  if (!m) return;

  const decision = $('verify-decision').value;
  const note = $('verify-note').value.trim();

  m.status = decision;
  const completionTarget = groupId ? getGroup(p, groupId) : p;
  if (completionTarget && decision !== 'Disetujui') { completionTarget.completionConfirmed = false; completionTarget.completedAt = ''; completionTarget.completedBy = ''; }
  m.reviewNote = note || (decision === 'Disetujui'
    ? 'Dokumen telah diperiksa dan dinyatakan lengkap.'
    : 'Dokumen perlu diperbaiki sesuai ketentuan.');
  m.verifiedBy = SEED.lecturer.name;
  m.verifiedAt = todayShort();

  const scope = groupId ? getGroup(p, groupId).name : p.title;
  pushNotif(
    decision === 'Disetujui' ? 'Dokumen proyek disetujui' : 'Dokumen proyek perlu revisi',
    `${m.name} pada "${scope}" — ${decision === 'Disetujui' ? 'disetujui' : 'diminta revisi'}.`
  );

  saveDB(); closeModal(); render();
  showToast(
    decision === 'Disetujui' ? `Tahap "${m.name}" disetujui.` : `Tahap "${m.name}" dikembalikan untuk revisi.`,
    decision === 'Disetujui' ? 'success' : 'warn'
  );
}

function saveLecturerNote(e, projectId, groupId) {
  e.preventDefault();
  const p = getProject(projectId);
  const g = groupId ? getGroup(p, groupId) : null;
  const target = g ? g : p;

  const d = $('ln-date').value;

  pushNotif('Catatan bimbingan baru', `Dosen menambahkan catatan pada ${g ? `kelompok "${g.name}"` : `proyek "${p.title}"`}.`);
  saveDB(); render();
  showToast('Catatan bimbingan disimpan.', 'success');
}

function saveMilestone(e, pid, groupId) {
  e.preventDefault();
  const p = getProject(pid);
  if (!p) return;
  const name = $('ms-name').value.trim();
  const desc = $('ms-desc').value.trim();
  if (!name || !desc) return;
  const newMilestone = {
    key: uid('ms'),
    name, desc,
    status: 'Belum Dimulai',
    fileName: '', submittedAt: '',
    verifiedBy: '', verifiedAt: '',
    note: '', reviewNote: '', revisionCount: 0
  };
  if (groupId) {
    const g = getGroup(p, groupId);
    if (g) { g.milestones.push(newMilestone); g.completionConfirmed = false; g.completedAt = ''; g.completedBy = ''; }
  } else if (isGroupProject(p)) {
    p.groups.forEach(g => { g.milestones.push({ ...newMilestone, key: uid('ms') }); g.completionConfirmed = false; g.completedAt = ''; g.completedBy = ''; });
  } else {
    p.milestones.push(newMilestone); p.completionConfirmed = false; p.completedAt = ''; p.completedBy = '';
  }
  saveDB(); closeModal(); render();
  showToast('Tahap dokumentasi ditambahkan.', 'success');
}

            <button onclick="rejectMemberProposal('${projectId}','${gid || ''}','${m.nim}')" class="btn btn-secondary text-rose-600" style="padding:.4rem .75rem;font-size:.68rem;">Tolak</button>
          ` : `
            <button onclick="removeMemberFromProject('${projectId}','${gid || ''}','${m.nim}')" class="btn btn-secondary text-rose-600" style="padding:.4rem .75rem;font-size:.68rem;">Keluarkan</button>
          `}
        </div>
      </div>`;
  }).join('') : '<p class="text-2xs text-slate-500 py-2">Belum ada anggota.</p>';

  const addMemberPicker = (gid) => {
    const currentNims = (isGroup ? allMembersOf(p) : p.members).map(m => m.nim);
    let available = students.filter(s => !currentNims.includes(s.nim));
    available = filterProjectMemberCandidates(p, available);

function filterAddMemberList(inputEl) {
  const term = (inputEl.value || '').toLowerCase().trim();
  document.querySelectorAll('#add-member-list label').forEach(el => {
    const hay = (el.textContent || '').toLowerCase();
    el.classList.toggle('hidden', !(term === '' || hay.includes(term)));
  });
}

function removeMemberFromProject(projectId, groupId, nim) {
  const p = getProject(projectId);
  if (!p) return;
  if (groupId) {
    const g = getGroup(p, groupId);
    if (g) g.members = g.members.filter(x => x.nim !== nim);
  } else {
    p.members = p.members.filter(x => x.nim !== nim);
  }
  if (projectMemberLimit(p) > 0 && !isProjectAtCapacity(p) && p.status === 'Open') p.registrationClosed = false;
  saveDB(); closeModal(); render();
  showToast('Anggota dikeluarkan dari proyek.', 'info');
}

function approveMemberProposal(projectId, groupId, nim) {
  const p = getProject(projectId);
  const g = p && groupId ? getGroup(p, groupId) : null;
  const m = (g ? g.members : (p ? p.members : [])).find(x => x.nim === nim);
  if (!m) return;
  m.approved = true;
  pushNotif('Usulan anggota disetujui', `${m.name} disetujui sebagai anggota${g ? ` kelompok "${g.name}"` : ''} pada proyek "${p.title}".`);
  saveDB(); closeModal(); render();
  showToast(`${m.name} disetujui sebagai anggota.`, 'success');
}

function rejectMemberProposal(projectId, groupId, nim) {
  const p = getProject(projectId);
  if (!p) return;
  const g = groupId ? getGroup(p, groupId) : null;
  const list = g ? g.members : p.members;
  const m = list.find(x => x.nim === nim);
  if (!m) return;
  if (g) g.members = g.members.filter(x => x.nim !== nim); else p.members = p.members.filter(x => x.nim !== nim);
  pushNotif('Usulan anggota ditolak', `${m.name} tidak disetujui sebagai anggota${g ? ` kelompok "${g.name}"` : ''} pada proyek "${p.title}". Slot kelompok kembali terbuka.`);
  saveDB(); closeModal(); render();
  showToast(`Usulan ${m.name} ditolak. Slot kelompok kembali terbuka.`, 'info');
}

function saveAddedMembers(projectId, groupId) {
  const p = getProject(projectId);
  if (!p) return;
  const checked = document.querySelectorAll('#add-member-list .add-member-checkbox:checked');
  let added = 0, skippedFull = 0, skippedProjectFull = 0;
  checked.forEach(cb => {
    const newM = {
      nim: cb.getAttribute('data-nim'),
      name: cb.getAttribute('data-name'),
      prodi: cb.getAttribute('data-prodi'),
      role: 'Anggota',
      approved: true
    };
    if (!isProjectMemberCandidateAllowed(p, newM.nim)) return;
    if (isProjectAtCapacity(p)) { skippedProjectFull++; return; }
    if (groupId) {
      const g = getGroup(p, groupId);
      if (g && isGroupFull(p, g)) { skippedFull++; }
      else if (g && !allMembersOf(p).some(x => x.nim === newM.nim)) {
        newM.role = g.members.length === 0 ? 'Ketua' : 'Anggota';
        g.members.push(newM); added++;
      }
    } else {
      if (!p.members.some(x => x.nim === newM.nim)) { p.members.push(newM); added++; }
    }
  });
  saveDB(); closeModal(); render();
  const skippedNotes = [
    skippedFull ? `${skippedFull} tidak ditambahkan karena kuota kelompok penuh` : '',
    skippedProjectFull ? `${skippedProjectFull} tidak ditambahkan karena kuota total proyek penuh` : ''
  ].filter(Boolean);
  showToast(`${added} anggota ditambahkan.${skippedNotes.length ? ' ' + skippedNotes.join('; ') + '.' : ''}`, added ? 'success' : 'info');
}

function openAddGroupModal(projectId) {
  const p = getProject(projectId);
  if (!p || !isGroupProject(p)) { showToast('Proyek bukan proyek berkelompok.', 'error'); return; }

  let students = filterProjectMemberCandidates(p, collectStudentOptions());
  // Mahasiswa yang sudah berada di kelompok lain tidak ditampilkan
  const takenNims = allMembersOf(p).map(m => m.nim);
  students = students.filter(s => !takenNims.includes(s.nim));

  openModal({
    title: 'Tambah Kelompok Baru',
    subtitle: `Proyek: ${p.title}`,
    size: 'lg',
    body: `
    <form onsubmit="saveNewGroup(event,'${projectId}')" class="space-y-4">
      <div><label class="lbl" for="ag-name">Nama Kelompok</label>
        <input id="ag-name" class="inp" required value="Kelompok ${groupNumber}"></div>

        <input type="text" id="ag-search" class="inp mb-2" placeholder="Cari nama atau NIM..." oninput="filterAddGroupList(this.value)">
        <div id="ag-list" data-per="${groupCapacity(p)}" class="max-h-56 overflow-y-auto scroll-thin-light rounded-2xl border border-violet-200 bg-white divide-y divide-slate-100">
          ${students.length ? students.map(s => `
            <label class="flex items-center gap-3 px-3 py-2.5 cursor-pointer hover:bg-violet-50/60 transition"
                   data-ag-search="${esc((s.name + ' ' + s.nim + ' ' + (s.prodi || '')).toLowerCase())}">
              <input type="checkbox" class="ag-member-checkbox w-4 h-4 rounded border-slate-300 text-violet-600 focus:ring-violet-500"
                     value="${esc(s.nim)}" data-name="${esc(s.name)}" data-nim="${esc(s.nim)}" data-prodi="${esc(s.prodi || '')}">
              <div class="min-w-0 flex-1">
                <p class="text-xs font-bold text-slate-800 truncate">${esc(s.name)}</p>
                <p class="text-2xs text-slate-500 truncate">${esc(s.nim)} · ${esc(s.prodi || '-')} · ${esc(s.angkatan || '-')} · ${esc(s.kelas || '-')}</p>
              </div>
            </label>`).join('') : `<p class="px-3 py-6 text-center text-2xs text-slate-500">Belum ada mahasiswa.</p>`}
        </div>
        <p class="hint mt-1 font-bold text-violet-700">Terpilih: <span id="ag-count">0</span> dari ${groupCapacity(p)} mahasiswa </p>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeModal()" class="btn btn-secondary">Batal</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-people-group" aria-hidden="true"></i> Tambah Kelompok</button>
      </div>
    </form>`
  });
}

function filterAddGroupList(q) {
  const term = (q || '').toLowerCase().trim();
  document.querySelectorAll('#ag-list [data-ag-search]').forEach(el => {
    const hay = el.getAttribute('data-ag-search') || '';
    el.classList.toggle('hidden', !(term === '' || hay.includes(term)));
  });
}

function saveNewGroup(e, projectId) {
  e.preventDefault();
  const p = getProject(projectId);
  if (!p || !isGroupProject(p)) return;
  const name = $('ag-name').value.trim() || `Kelompok ${(p.groups || []).length + 1}`;
  const members = [];
  if (document.querySelectorAll('#ag-list .ag-member-checkbox:checked').length > groupCapacity(p)) {
    showToast(`Anggota melebihi kuota (maks. ${groupCapacity(p)} orang per kelompok).`, 'error'); return;
  }
  document.querySelectorAll('#ag-list .ag-member-checkbox:checked').forEach(cb => {
    const nim = cb.getAttribute('data-nim');
    if (!isProjectMemberCandidateAllowed(p, nim)) return;
    members.push({
      nim,
      name: cb.getAttribute('data-name'),
      prodi: cb.getAttribute('data-prodi'),
      role: members.length === 0 ? 'Ketua' : 'Anggota',
      approved: true
    });
  });
  const selectedCount = document.querySelectorAll('#ag-list .ag-member-checkbox:checked').length;
  if (members.length !== selectedCount) {
    showToast('Anggota kelompok harus sesuai dengan mata kuliah/angkatan proyek dan berasal dari akun aktif yang dikelola Admin.', 'error');
    return;
  }
  p.groups.push({
    id: uid('GRP'),
    name,
    members,
    milestones: [],
    guidance: []
  });
  p.groupCount = p.groups.length;
  saveDB(); closeModal(); render();
  showToast(`Kelompok "${name}" berhasil ditambahkan.`, 'success');
}

function isLecturerOwnedGeneralProject(p) {
  if (!isPublicMarketplaceProject(p) || !p) return false;
  if (p.ownerNip) return String(p.ownerNip) === String(SEED.lecturer.nip)
    && !['Diajukan', 'Ditolak', 'Closed'].includes(p.status);
  const ownsProject = p.creatorNip === SEED.lecturer.nip
    || p.creator === SEED.lecturer.name
    || p.supervisorNip === SEED.lecturer.nip
    || p.supervisor === SEED.lecturer.name;
  return ownsProject && !['Diajukan', 'Ditolak', 'Closed'].includes(p.status);
}

function sendInvitation(e, nim) {
  e.preventDefault();
  const s = db.talentPool.find(x => x.nim === nim);
  const p = getProject($('inv-project') ? $('inv-project').value : '');
  if (!s || !isLecturerOwnedGeneralProject(p)) {
    showToast('Undangan hanya dapat dikirim ke proyek umum yang dimiliki dosen ini.', 'error');
    return;
  }
  const role = $('inv-role').value.trim();

  pushNotif('Undangan kolaborasi terkirim', `${s.name} diundang ke proyek "${p.title}" sebagai ${role}.`);

  db.invitations.push({
    id: uid('inv'), nim:String(nim),
    sender: SEED.lecturer.name,
    role: 'Dosen Pembimbing',
    projectId: p.id,
    projectTitle: p.title,
    message: $('inv-message').value.trim(),
    date: todayShort(),
    status: 'Menunggu Respon'
  });

  saveDB(); closeModal(); render();
  showToast(`Undangan berhasil dikirim kepada ${s.name}.`, 'success');
}

/* -------- REVIEW PROPOSAL (khusus dosen) -------- */
function openReviewProposalModal(id) {
  if (state.userRole !== 'lecturer') { showToast('Hanya dosen yang dapat meninjau usulan proyek.', 'error'); return; }
  const p = getProject(id);
  if (!p || p.status !== 'Diajukan') { showToast('Usulan proyek tidak ditemukan atau sudah ditinjau.', 'warn'); return; }
  if (!proposalsForRole('lecturer').some(item => String(item.id) === String(id)) || !canApproveProject(p, 'lecturer', SEED.lecturer)) {
    showToast('Usulan ini ditujukan kepada dosen lain. Hanya dosen yang dipilih mahasiswa yang dapat meninjaunya.', 'error'); return;
  }
  const isCourse = isCourseProject(p), isIum = isIumProject(p);
  const approveValue = (isCourse || isIum) ? STATUS_ACTIVE : 'Open';

  openModal({
    title: 'Keputusan Usulan Proyek',
    subtitle: p.title,
    size: 'md',
    body: `
    <form onsubmit="submitReviewProposal(event,'${p.id}')" class="space-y-4">
      <div>
        <label class="lbl" for="rv-decision">Keputusan</label>
        <select id="rv-decision" class="inp">
          <option value="${approveValue}">Setujui</option>
          <option value="Ditolak">Tolak</option>
        </select>
      </div>
      <div>
        <label class="lbl" for="rv-note">Catatan untuk Mahasiswa (opsional)</label>
        <textarea id="rv-note" rows="3" class="inp" placeholder="Tambahkan catatan bila diperlukan..."></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeModal()" class="btn btn-secondary">Batal</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check" aria-hidden="true"></i> Simpan Keputusan</button>
      </div>
    </form>`
  });
}

function submitReviewProposal(e, id) {
  e.preventDefault();
  if (state.userRole !== 'lecturer') { showToast('Hanya dosen yang dapat meninjau usulan proyek.', 'error'); return; }
  const p = getProject(id);
  if (!p || p.status !== 'Diajukan' || p.ownerNip) {
    showToast('Usulan ini sudah ditinjau atau telah menjadi milik dosen lain.', 'warn');
    closeModal(); render(); return;
  }
  if (!proposalsForRole('lecturer').some(item => String(item.id) === String(id)) || !canApproveProject(p, 'lecturer', SEED.lecturer)) {
    showToast('Usulan ini ditujukan kepada dosen lain. Keputusan tidak disimpan.', 'error');
    closeModal(); render(); return;
  }
  const decision = $('rv-decision').value;
  const note = $('rv-note').value.trim();
  const approved = decision !== 'Ditolak';
  const isIum = isIumProject(p), isCourse = isCourseProject(p);

  p.status = decision;
  if (approved) {
    // Pengambilan kepemilikan satu kali: setelah disetujui, usulan tidak lagi muncul di dosen lain.
    p.supervisor = SEED.lecturer.name;
    p.supervisorNip = SEED.lecturer.nip;
    p.ownerNip = SEED.lecturer.nip;
    p.ownerName = SEED.lecturer.name;
    p.ownedAt = todayShort();
  }

  if (isCourse && approved && p.studentCreated) {
    (p.groups || []).forEach(g => (g.members || []).forEach(m => { if (m.approved === false) m.approved = true; }));
  } else if (isCourse && approved) {
    let kelas = kelasForCourse(p.course);
    if (!kelas.length) {
      kelas = Array.from(new Set(allMembersOf(p).map(m => studentKelas(m.nim)).filter(Boolean)));
    }
    p.kelas = kelas;
  }

  const okTitle = isCourse ? 'Proyek kelas diaktifkan' : isIum ? 'Usulan IUM disetujui' : 'Usulan proyek disetujui';
  const okBody = isCourse ? 'telah diaktifkan sebagai Proyek Kelas'
    : isIum ? `telah disetujui dosen dan ditugaskan kepada ${p.supervisor}`
    : 'telah dipublikasikan';
  const notificationBody = `${p.title} — ${approved ? okBody : 'tidak dilanjutkan'}${note ? `. Catatan: ${note}` : ''}`;
  const ownerIsStudent = (db.users || []).some(u => u.role === 'student' && String(u.nim || u.username || '') === String(p.creatorNim || ''));
  if (!approved && ownerIsStudent) {
    pushNotif('Usulan proyek ditolak', notificationBody, {
      recipientRole: 'student', recipientNim: p.creatorNim, projectId: p.id
    });
  } else {
    pushNotif(approved ? okTitle : 'Usulan proyek ditolak', notificationBody,
      ownerIsStudent ? { recipientRole: 'student', recipientNim: p.creatorNim, projectId: p.id } : {});
  }

  saveDB(); closeModal(); render();
  showToast(
    !approved ? 'Usulan proyek ditolak.'
      : isCourse ? 'Proyek disetujui dan diaktifkan sebagai Proyek Kelas.'
      : isIum ? `Usulan IUM disetujui oleh dosen. Dosen pembimbing: ${p.supervisor}.`
      : 'Usulan proyek disetujui dan dipublikasikan.',
    approved ? 'success' : 'info'
  );
}

function decideProposal(id, d) {
  if (state.userRole !== 'lecturer') { showToast('Hanya dosen yang dapat meninjau usulan proyek.', 'error'); return; }
  const p = getProject(id);
  if (!p) return;
  if (d === 'Open' || d === STATUS_ACTIVE) { openReviewProposalModal(id); return; }
  p.status = d;
  pushNotif('Usulan proyek ditolak', p.title);
  saveDB(); render(); showToast('Usulan ditolak.', 'info');
}

        <div class="min-w-0 flex-1">
          <h3 class="text-base font-extrabold text-slate-900">${esc(name)}</h3>
          <p class="text-2xs text-slate-500 mt-1">${esc(prodi)} · Angkatan ${esc(student?.angkatan || talent.angkatan || '-')} · Kelas ${esc(student?.kelas || talent.kelas || '-')}</p>
          <div class="flex flex-wrap gap-2 mt-3">
            <span class="badge badge-neutral">IPK ${esc(gpaText)}</span>
            <span class="badge badge-neutral">Poin MEXS ${mexs != null ? esc(mexs) : '-'}</span>
            ${a.status ? badge(a.status) : ''}
          </div>
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-3">
        <div class="p-3 rounded-2xl border border-slate-200"><p class="text-2xs font-bold text-slate-500 uppercase">Surel Akademik</p><p class="mt-1 font-semibold text-slate-800 break-all">${esc(email || '-')}</p></div>
        <div class="p-3 rounded-2xl border border-slate-200"><p class="text-2xs font-bold text-slate-500 uppercase">Telepon</p><p class="mt-1 font-semibold text-slate-800">${esc(phone || '-')}</p></div>
      </div>

      <div><p class="text-2xs font-bold text-slate-500 uppercase mb-1.5">Tentang Saya</p><p class="leading-relaxed text-slate-700 whitespace-pre-line">${esc(bio || 'Mahasiswa belum mengisi ringkasan profil.')}</p></div>
      <div><p class="text-2xs font-bold text-slate-500 uppercase mb-1.5">Keahlian & Kompetensi</p><div class="flex flex-wrap gap-1.5">${skills.map(k => `<span class="badge badge-neutral">${esc(k)}</span>`).join('') || '<span class="text-2xs text-slate-400">Belum ada keahlian yang dicantumkan.</span>'}</div></div>

      <div class="p-4 rounded-2xl bg-violet-50/60 border border-violet-100">
        <p class="text-2xs font-bold text-violet-700 uppercase mb-1.5">Lamaran pada Proyek Ini</p>
        <p class="text-xs font-semibold text-slate-800">Posisi: ${esc(a.role || 'Anggota Tim')}</p>
        <p class="text-xs text-slate-700 leading-relaxed mt-2 whitespace-pre-line">${esc(a.motivation || 'Tidak ada motivasi yang dicantumkan.')}</p>
        ${a.skills ? `<p class="text-2xs text-slate-500 mt-2"><strong>Keahlian yang dicantumkan saat melamar:</strong> ${esc(a.skills)}</p>` : ''}

function openMilestoneDetail(pid, key, groupId) {
  const p = getProject(pid);
  if (state.userRole === 'student' && groupId && isGroupProject(p)) {
    const targetGroup = getGroup(p, groupId);
    if (!targetGroup || !targetGroup.members.some(member => String(member.nim) === String(SEED.student.nim) && member.approved !== false)) {
      showToast('Dokumentasi hanya dapat dilihat oleh anggota kelompok terkait.', 'error');
      return;
    }
  }
  const m = groupId ? getGroupMilestone(getGroup(p, groupId), key) : (p && getMilestone(p, key));
  if (!m) return;
  const box = (t, c) => `<div class="p-3.5 rounded-2xl border border-slate-200 mb-3"><p class="text-2xs font-bold text-slate-500 uppercase">${t}</p>${c}</div>`;
  openModal({ title: esc(m.name), subtitle: esc(m.desc), size: 'md', body: `
    ${box('Status', `<p class="mt-1">${badge(m.status)} <span class="text-xs font-semibold text-slate-700 ml-1">${esc(m.status)}</span></p>`)}
    ${m.fileName ? box('Dokumen', `<p class="text-xs font-semibold text-slate-800 mt-1 break-all"><i class="fa-solid fa-file-lines text-violet-600 mr-1.5"></i>${esc(m.fileName)}</p>${m.fileId ? `<button onclick="openStoredDocument('${m.fileId}')" class="btn btn-secondary btn-sm mt-2"><i class="fa-solid fa-eye" aria-hidden="true"></i> Buka Dokumen</button>` : '<p class="hint">Berkas contoh/lama belum memiliki isi file tersimpan.</p>'}`) : box('Dokumen', '<p class="text-xs text-slate-400 mt-1">Belum ada dokumen.</p>')}
    ${box('Riwayat', `<p class="text-xs font-semibold text-slate-800 mt-1">${esc(m.submittedAt || '—')}</p><p class="text-2xs text-slate-500 mt-0.5">${m.revisionCount ? 'Revisi ke-' + m.revisionCount : 'Belum ada revisi'}</p>`)}
    ${m.note ? box('Catatan Mahasiswa', `<p class="text-xs text-slate-700 mt-1">${esc(m.note)}</p>`) : ''}
    ${m.reviewNote ? box('Catatan Verifikasi', `<p class="text-xs text-slate-700 mt-1">${esc(m.reviewNote)}</p>${m.verifiedBy ? `<p class="text-2xs text-slate-500 mt-1.5">— ${esc(m.verifiedBy)}, ${esc(m.verifiedAt)}</p>` : ''}`) : ''}`,

function confirmDeleteProject(pid) {
  const p = getProject(pid); if (!p) return;
  if (!canDeleteProject(p)) { showToast('Anda hanya dapat menghapus proyek milik Anda sendiri.', 'error'); return; }
  openModal({ title: 'Hapus proyek?', subtitle: esc(p.title), size: 'sm',
    body: `<p class="text-xs text-slate-600 leading-relaxed">Proyek akan dihapus permanen beserta seluruh data kelompok, pelamar, dan dokumentasinya. Tindakan ini tidak dapat dibatalkan.</p>`,
    footer: `<button onclick="closeModal()" class="btn btn-secondary">Batal</button><button onclick="deleteProject('${pid}')" class="btn btn-danger"><i class="fa-solid fa-trash" aria-hidden="true"></i> Ya, Hapus</button>` });
}
function deleteProject(pid) {
  const p = getProject(pid); if (!p) { closeModal(); return; }
  if (!canDeleteProject(p)) { closeModal(); showToast('Anda hanya dapat menghapus proyek milik Anda sendiri.', 'error'); return; }
  db.projects = db.projects.filter(x => x.id !== pid);
  state.lecturerProjectId = null; state.studentProjectId = null;
  state.lecturerGroupId = null; state.studentGroupId = null;
  pushNotif('Proyek dibubarkan', `Proyek "${p.title}" telah dihapus oleh dosen.`);
  saveDB(); closeModal(); render(); showToast('Proyek berhasil dihapus.', 'info');
}
function decideApplicant(projectId, applicantId, decision) {
  const p = getProject(projectId);
  if (!p) return;
  if (state.userRole !== 'lecturer' || !isManagedByActiveLecturer(p)) {
    showToast('Anda hanya dapat memproses pelamar pada proyek yang menjadi tanggung jawab Anda.', 'error');
    return;
  }
  const a = p.applicants.find(x => x.id === applicantId);
  if (!a) return;

  if (decision === 'Diterima' && isProjectAtCapacity(p)) {
    showToast('Kuota total anggota proyek sudah penuh. Pelamar tidak dapat diterima lagi.', 'warn');
    return;
  }
  if (decision === 'Diterima' && isGroupProject(p)) {
    const target = (p.groups || []).find(g => (g.members || []).length < groupCapacity(p));
    if (!target) {
      showToast('Semua kelompok sudah mencapai kapasitas. Tambahkan kelompok atau tambah kapasitas per kelompok terlebih dahulu.', 'warn');
      return;
    }
  }
  a.status = decision;
  if (decision === 'Diterima') {
    if (isGroupProject(p)) {
      const target = (p.groups || []).find(g => (g.members || []).length < groupCapacity(p));
      if (target && !target.members.some(m => m.nim === a.nim)) {
        target.members.push({ nim: a.nim, name: a.name, prodi: a.prodi, role: a.role || 'Anggota', approved: true });
      }
    } else {
      if (!p.members.some(m => m.nim === a.nim)) {
        p.members.push({ nim: a.nim, name: a.name, prodi: a.prodi, role: a.role || 'Anggota Tim', approved: true });
      }
    }
    if (isProjectAtCapacity(p)) {
      p.registrationClosed = true;
      pushNotif('Pendaftaran proyek ditutup', `Proyek "${p.title}" telah mencapai kuota maksimum.`);
    }
    pushNotif('Pelamar diterima', `${a.name} diterima pada proyek "${p.title}".`);
  } else {
    pushNotif('Pelamar ditolak', `Pendaftaran ${a.name} tidak dilanjutkan.`);
  }

  saveDB(); render();
  showToast(
    decision === 'Diterima' ? `${a.name} diterima sebagai anggota tim.` : `Pendaftaran ${a.name} ditolak.`,
    decision === 'Diterima' ? 'success' : 'info'
  );
}

function onNewUserRoleChange() {
  const role = $('nu-role').value;
  const emailInput = $('nu-email');
  const studentFields = $('nu-student-fields');
  const lecturerFields = $('nu-lecturer-fields');
  const gpaInput = $('nu-gpa');
  if (gpaInput) {
    gpaInput.disabled = role !== 'student';
    gpaInput.required = role === 'student';
  }
  if (!emailInput.value) {
    emailInput.placeholder = role === 'student' ? 'nama@mhs.unmul.ac.id' : 'nama@unmul.ac.id';
  }
  if (role === 'student') {
    studentFields.classList.remove('hidden');
    lecturerFields.classList.add('hidden');
  } else {
    studentFields.classList.add('hidden');
    lecturerFields.classList.remove('hidden');
    if (!$('nu-mk-list').children.length) addMataKuliahRow();
  }
}
