<script>
/* ============================================================================
   KREASI — Sistem Kolaborasi & Rekam Jejak Prestasi Mahasiswa
   ========================================================================== */

const APP = {
  name: 'KREASI',
  long: 'Sistem Kolaborasi & Rekam Jejak Prestasi Mahasiswa',
  faculty: 'Fakultas Teknik',
  prodi: 'Program Studi S1 Informatika',
  university: 'Universitas Mulawarman',
  year: 2026
};

/* ---------------------------------- Utils --------------------------------- */
const $  = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
const today = () => new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' });
const todayShort = () => new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
function semesterForCohort(angkatan, date = new Date()) {
  const cohortYear = Number.parseInt(String(angkatan || '').trim(), 10);
  if (!Number.isFinite(cohortYear) || cohortYear < 1900) return '-';
  const year = date.getFullYear();
  const month = date.getMonth();
  const semester = month >= 7
    ? ((year - cohortYear) * 2 + 1)
    : (((year - 1) - cohortYear) * 2 + 2);
  return `Semester ${Math.max(1, semester)}`;
}
const LEGACY_DEMO_STUDENT_NIM = '2110512001';
const DEMO_ACHIEVEMENT_IDS = new Set(['ACH-001','ACH-002','ACH-003','ACH-004','ACH-005','ACH-006','ACH-007']);
const DEMO_ACHIEVEMENT_TITLES = new Set([
  'Juara 2 Hackathon Nasional GovTech 2025',
  'Publikasi Jurnal Nasional Terakreditasi SINTA 3',
  'Sertifikasi AWS Certified Cloud Practitioner',
  'Asisten Laboratorium Pemrograman Lanjut 2025/2026',
  'Juara 1 Lomba Desain UI/UX Dies Natalis UNMUL',
  'Pengabdian Masyarakat — Digitalisasi Desa Wisata Pampang',
  'Magang Bersertifikat (MBKM) di PT Solusi Digital Nusantara'
]);

/*
 * Semua penyimpanan penting terhubung ke API Django.
 * Cookie CSRF dipakai agar permintaan perubahan data berasal dari halaman aplikasi ini.
 */
function getCookie(name) {
  const match = document.cookie.split('; ').find(row => row.startsWith(name + '='));
  return match ? decodeURIComponent(match.split('=').slice(1).join('=')) : '';
}

// Pembungkus fetch supaya permintaan POST, PUT, dan DELETE membawa token keamanan Django.
function apiRequest(url, options = {}) {
  const headers = new Headers(options.headers || {});
  const method = String(options.method || 'GET').toUpperCase();
  if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
    const token = getCookie('csrftoken');
    if (token) headers.set('X-CSRFToken', token);
  }
  return fetch(url, { ...options, headers, credentials: 'same-origin' });
}

// Menyimpan isi file di server Django dan mengembalikan ID untuk ditautkan pada data proyek/prestasi.
async function storeUploadedDocument(file, metadata = {}) {
  if (!file) return null;
  const form = new FormData();
  form.append('file', file);
  form.append('metadata', JSON.stringify(metadata || {}));
  const response = await apiRequest('/api/documents/', { method: 'POST', body: form });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(result.error || 'Berkas gagal disimpan ke server.');
  return result.id;
}

// Menghapus salinan berkas dari server saat pengguna membatalkan atau mengganti lampiran.
async function removeStoredDocument(id) {
  if (!id) return;
  const response = await apiRequest(`/api/documents/${encodeURIComponent(id)}/`, { method: 'DELETE' });
  if (!response.ok && response.status !== 404) {
    const result = await response.json().catch(() => ({}));
    throw new Error(result.error || 'Berkas gagal dihapus dari server.');
  }
}

function ensureFilePicker(inputId, statusId) {
  const input = $(inputId);
  const status = $(statusId);
  if (!input) return null;
  if (input.dataset.filePickerReady === 'true') {
    return {
      input,
      status,
      name: input.parentElement?.querySelector('.file-picker-name'),
      remove: input.parentElement?.querySelector('.file-picker-remove')
    };
  }

  const wrapper = document.createElement('div');
  wrapper.className = 'file-picker';
  input.parentNode.insertBefore(wrapper, input);
  input.className = 'file-picker-native';
  input.removeAttribute('style');
  wrapper.appendChild(input);

  const trigger = document.createElement('span');
  trigger.className = 'file-picker-trigger';
  trigger.textContent = 'Pilih File';
  trigger.setAttribute('aria-hidden', 'true');

  const name = document.createElement('span');
  name.className = 'file-picker-name';
  name.textContent = 'Belum ada berkas dipilih';
  name.setAttribute('aria-hidden', 'true');

  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'file-picker-remove';
  remove.setAttribute('aria-label', 'Hapus berkas yang dipilih');
  remove.title = 'Hapus berkas';
  remove.innerHTML = '<i class="fa-solid fa-xmark" aria-hidden="true"></i>';
  remove.addEventListener('click', event => {
    event.preventDefault();
    event.stopPropagation();
    clearSelectedFile(inputId, statusId);
  });

  wrapper.append(trigger, name, remove);
  input.dataset.filePickerReady = 'true';
  input.dataset.fileStatusId = statusId;
  if (status) status.classList.add('sr-only');
  return { input, status, name, remove };
}
function updateSelectedFileStatus(inputId, statusId) {
  const picker = ensureFilePicker(inputId, statusId);
  if (!picker) return;
  const file = picker.input.files && picker.input.files[0];
  const size = file ? ` (${Math.ceil(file.size / 1024)} KB)` : '';
  if (picker.name) {
    picker.name.textContent = file ? `${file.name}${size}` : 'Belum ada berkas dipilih';
    picker.name.title = file ? file.name : '';
  }
  if (picker.remove) picker.remove.style.display = file ? 'inline-flex' : 'none';
  if (picker.status) {
    picker.status.textContent = file ? `Berkas dipilih: ${file.name}${size}` : 'Belum ada berkas dipilih.';
    picker.status.classList.add('sr-only');
  }
}
function clearSelectedFile(inputId, statusId) {
  const input = $(inputId);
  if (input) input.value = '';
  updateSelectedFileStatus(inputId, statusId);
}
function initializeFilePickers(root = document) {
  if (!root || !root.querySelectorAll) return;
  root.querySelectorAll('input[type="file"][onchange*="updateSelectedFileStatus"]').forEach(input => {
    const inlineHandler = input.getAttribute('onchange') || '';
    const match = inlineHandler.match(/updateSelectedFileStatus\('([^']+)'\s*,\s*'([^']+)'\)/);
    if (match) updateSelectedFileStatus(match[1], match[2]);
  });
}
// Mengambil isi berkas dari Django agar dapat dipratinjau atau diunduh oleh fitur lama.
async function getStoredDocument(id) {
  if (!id) return null;
  const response = await apiRequest(`/api/documents/${encodeURIComponent(id)}/`);
  if (response.status === 404) return null;
  if (!response.ok) {
    const result = await response.json().catch(() => ({}));
    throw new Error(result.error || 'Berkas tidak dapat dibaca dari server.');
  }
  const encodedName = response.headers.get('X-Document-Name') || 'dokumen';
  let name = 'dokumen';
  try { name = decodeURIComponent(encodedName); } catch (_) { name = encodedName; }
  const blob = await response.blob();
  return { id, name, type: blob.type || 'application/octet-stream', size: blob.size, blob };
}

function studentCanAccessGroupDocument(fileId) {
  if (state.userRole !== 'student' || !fileId) return true;
  for (const project of (db.projects || [])) {
    if (!isGroupProject(project)) continue;
    for (const group of (project.groups || [])) {
      const hasFile = (group.milestones || []).some(m => String(m.fileId || '') === String(fileId));
      if (hasFile) return (group.members || []).some(m =>
        String(m.nim) === String(SEED.student.nim) && m.approved !== false
      );
    }
  }
  return true;
}

async function openStoredDocument(id) {
  if (!studentCanAccessGroupDocument(id)) {
    showToast('Dokumentasi hanya dapat dibuka oleh anggota kelompok terkait.', 'error');
    return;
  }
  // Buka tab sinkron dengan klik pengguna agar pemblokir pop-up tidak menutup pratinjau.
  const tab = window.open('about:blank', '_blank');
  try {
    if (!id) throw new Error('Berkas ini belum tersimpan pada penyimpanan dokumen.');
    const record = await getStoredDocument(id);
    if (!record || !record.blob) throw new Error('Berkas tidak ditemukan. Untuk dokumen lama, unggah ulang berkas aslinya.');
    const url = URL.createObjectURL(record.blob);
    if (tab) {
      tab.opener = null;
      tab.location.href = url;
    } else {
      const link = document.createElement('a');
      link.href = url;
      link.download = record.name || 'dokumen';
      link.rel = 'noopener';
      document.body.appendChild(link);
      link.click();
      link.remove();
    }
    // Jangka waktu cukup agar PDF viewer sempat membaca objek URL.
    window.setTimeout(() => URL.revokeObjectURL(url), 5 * 60 * 1000);
  } catch (error) {
    if (tab && !tab.closed) tab.close();
    console.error('KREASI: berkas tidak dapat dibuka', error);
    showToast(error.message || 'Berkas tidak dapat dibuka.', 'error');
  }
}
async function downloadStoredDocument(id) {
  if (!studentCanAccessGroupDocument(id)) {
    showToast('Dokumentasi hanya dapat diunduh oleh anggota kelompok terkait.', 'error');
    return;
  }
  try {
    if (!id) throw new Error('Berkas ini belum memiliki file yang tersimpan.');
    const record = await getStoredDocument(id);
    if (!record || !record.blob) throw new Error('Berkas fisik tidak ditemukan. Minta mahasiswa mengunggah ulang berkas aslinya.');
    const url = URL.createObjectURL(record.blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = record.name || 'dokumen';
    link.rel = 'noopener';
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 60 * 1000);
  } catch (error) {
    console.error('KREASI: berkas tidak dapat diunduh', error);
    showToast(error.message || 'Berkas tidak dapat diunduh.', 'error');
  }
}

/* Mata kuliah yang dapat dipilih mahasiswa saat membuat proyek: hanya yang diambilnya */
function courseChoicesForStudent(nim) {

function studentCourseMemberPool(course, excludeNim) {

function studentKelas(nim) {
  const u = (db && db.users) ? db.users.find(x => x.role === 'student' && x.nim === nim) : null;

}
function studentAngkatan(nim) {
  const u = (db && db.users) ? db.users.find(x => x.role === 'student' && x.nim === nim) : null;

}

/* Mata kuliah yang diambil mahasiswa (diisi Admin saat membuat/ubah akun).
   null = data lama tanpa informasi (tidak dibatasi). */
function studentCourses(nim) {
  const u = (db && db.users) ? db.users.find(x => x.role === 'student' && x.nim === nim) : null;
  return u && Array.isArray(u.mataKuliahDiambil) ? u.mataKuliahDiambil : null;
}
function studentTakesCourse(nim, course) {
  if (!course) return true;
  const list = studentCourses(nim);
  return list === null ? true : list.includes(course);
}

/* Kelas untuk course — berdasarkan offering */
function kelasForCourse(course, angkatan) {
  const offs = (db && db.masterData && db.masterData.courseOfferings) || [];
  const o = offs.filter(x => x.course === course);
  const kelas = [];
  o.forEach(item => { 
    if (item.kelas && !kelas.includes(item.kelas)) kelas.push(item.kelas); 
  });
  return kelas;
}

function getLecturerCourses(nip) {
  const lect = db.users.find(u => u.role === 'lecturer' && u.nip === nip);

  return lect.mataKuliahDiampu;
}

// Nama mata kuliah komunitas menggunakan satu label kanonis.
function isCommunityCourseName(course) {
  return String(course || '').toLocaleLowerCase('id-ID').replace(/\s+/g, ' ').trim()
    .includes('informatika untuk masyarakat');
}
function lecturerTeachesCommunityCourse(nip) {
  if (!nip || !db) return false;
  const assigned = getLecturerCourses(nip).some(item => isCommunityCourseName(item && item.course));
  const offered = ((db.masterData && db.masterData.courseOfferings) || [])
    .some(item => String(item.lecturerNip || '') === String(nip) && isCommunityCourseName(item.course));
  return assigned || offered;
}
function studentTakesCommunityCourse(nim) {
  const courses = studentCourses(nim);
  // Enrolmen yang tidak tercatat tidak dianggap memenuhi syarat untuk proyek IUM.
  return Array.isArray(courses) && courses.some(isCommunityCourseName);
}
function communityCourseName() {
  const all = [
    ...((db && db.masterData && db.masterData.courses) || []),
    ...(((db && db.masterData && db.masterData.courseOfferings) || []).map(item => item.course)),
    ...((db && db.users) || []).flatMap(user => user.role === 'lecturer' ? (user.mataKuliahDiampu || []).map(item => item.course) : [])
  ].filter(Boolean);
  return all.find(isCommunityCourseName) || 'Informatika Untuk Masyarakat';
}

/* Cek apakah mahasiswa termasuk dalam lingkup MK yang diampu dosen */
function isStudentInLecturerScope(nim, nip) {
  const courses = getLecturerCourses(nip);

  const sAngkatan = studentAngkatan(nim);

  return courses.some(mk => {
    const matchAngkatan = (mk.angkatan || []).includes(sAngkatan);
    const matchKelas = (mk.kelas || []).includes(sKelas);
    return matchAngkatan && matchKelas;
  });
}

  const master = [...configuredProjectCategories()];

/* ---------------------- HELPER PROYEK BERKELOMPOK ------------------------- */
function buildGroup(name, members = []) {
  return {
    id: uid('GRP'),
    name: name || 'Kelompok',
    members: Array.isArray(members) ? members : [],
    milestones: [],
    guidance: []
  };
}

function isGroupProject(p) { return !!p && p.isGroup === true; }
function getGroup(p, groupId) { return p && p.groups ? p.groups.find(g => g.id === groupId) : null; }
function projectAssignedMemberCount(p) {
  if (!p) return 0;
  return isGroupProject(p) ? allMembersOf(p).length : (p.members || []).length;
}
function projectMemberLimit(p) {
  // Proyek Mata Kuliah dan IUM bersifat privat; anggota dan kelompok dikelola khusus,
  // sehingga membersNeeded bukan kuota pendaftaran umum pada dua kategori ini.
  if (p && isPrivateProjectCategory(p)) return 0;
  const limit = Number(p && p.membersNeeded);
  return Number.isFinite(limit) && limit > 0 ? limit : 0;
}
function isProjectAtCapacity(p) {
  const limit = projectMemberLimit(p);
  return !!p && limit > 0 && projectAssignedMemberCount(p) >= limit;
}
function projectMemberCountLabel(p) {
  const count = projectAssignedMemberCount(p);
  const limit = projectMemberLimit(p);
  return limit > 0 ? `${count} dari ${limit} orang` : `${count} orang (tanpa kuota tetap)`;
}
// Menghitung dokumen yang sudah disetujui agar indikator progres setiap kelompok mengikuti status nyata.
function groupProgress(g) {
  const total = g.milestones.length;
  const done = g.milestones.filter(m => m.status === 'Disetujui').length;
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}
function groupProjectProgress(p) {
  if (!isGroupProject(p)) return projectProgress(p);
  const total = (p.groups || []).length;
  if (!total) return { done: 0, total: 0, pct: 0 };
  let sumDone = 0, sumTotal = 0;
  p.groups.forEach(g => { const gp = groupProgress(g); sumDone += gp.done; sumTotal += gp.total; });
  return { done: sumDone, total: sumTotal, pct: sumTotal ? Math.round((sumDone / sumTotal) * 100) : 0 };
}
function allMembersOf(p) {
  if (!isGroupProject(p)) return p.members || [];
  const map = new Map();
  (p.groups || []).forEach(g => g.members.forEach(m => { if (!map.has(m.nim)) map.set(m.nim, m); }));
  return Array.from(map.values());
}
function approvedMembersOf(p) {
  if (!isGroupProject(p)) return (p.members || []).filter(m => m.approved !== false);
  const map = new Map();
  (p.groups || []).forEach(g => g.members.filter(m => m.approved !== false).forEach(m => { if (!map.has(m.nim)) map.set(m.nim, m); }));
  return Array.from(map.values());
}
function projectMemberCount(p) {
  return isGroupProject(p) ? allMembersOf(p).length : (p.members || []).length;
}
function findGroupByStudent(p, nim) {
  if (!isGroupProject(p)) return null;
  return (p.groups || []).find(g => g.members.some(m => m.nim === nim)) || null;
}

/* ---------------- KELENGKAPAN KELOMPOK & PENGAJUAN ANGGOTA ---------------- */
/* Mahasiswa dalam cakupan angkatan & kelas proyek Proyek Mata Kuliah */
function isStudentInCourseScope(p, nim) {
  if (!p || p.category !== COURSE_CATEGORY || !nim) return false;
  /* Kandidat anggota harus mengambil mata kuliah dan berada dalam angkatan/kelas yang dipilih. */
  let ang = studentAngkatan(nim), kls = studentKelas(nim);
  if (typeof SEED !== 'undefined' && SEED.student && SEED.student.nim === nim) {
    ang = ang || SEED.student.angkatan || '';
    kls = kls || SEED.student.kelas || '';
  }
  const okA = !p.angkatan || p.angkatan === ang;
  const okK = !Array.isArray(p.kelas) || !p.kelas.length || p.kelas.includes(kls);
  return okA && okK && studentTakesCourse(nim, p.course);
}
function groupCapacity(p) { return Math.max(1, Number(p && p.membersPerGroup) || 1); }
function groupSlotsLeft(p, g) { return Math.max(0, groupCapacity(p) - ((g && g.members) ? g.members.length : 0)); }
function isGroupFull(p, g) { return groupSlotsLeft(p, g) === 0; }

/* Aturan: mahasiswa hanya boleh mengusulkan anggota ke kelompok yang belum lengkap.
   - Proyek Mata Kuliah : mahasiswa dalam cakupan angkatan & kelas. Yang sudah punya kelompok
                         hanya boleh mengusulkan ke kelompoknya sendiri.
   - Kategori lain      : hanya anggota (yang sudah disetujui) kelompok tsb. */
function canProposeMemberToGroup(p, g, nim) {
  if (!p || !g || !isGroupProject(p)) return { ok: false, message: 'Proyek bukan proyek berkelompok.' };
  if (p.status === 'Diajukan' || p.status === 'Ditolak' || p.status === 'Closed') {
    return { ok: false, message: 'Proyek belum dibuka untuk pengajuan anggota.' };
  }
  if (isProjectAtCapacity(p)) {
    return { ok: false, full: true, message: 'Kuota total anggota proyek sudah penuh.' };
  }
  if (isGroupFull(p, g)) {
    return { ok: false, full: true, message: `Kelompok sudah lengkap (${g.members.length}/${groupCapacity(p)} anggota). Pengajuan anggota ditutup.` };
  }
  const mine = findGroupByStudent(p, nim);
  if (p.category === COURSE_CATEGORY) {
    if (!mine && (p.studentCreated || !isStudentInCourseScope(p, nim))) {
      return { ok: false, message: 'Anda bukan bagian dari angkatan, kelas, atau mata kuliah yang ditentukan dosen.' };
    }
    if (mine) {
      const me = mine.members.find(m => m.nim === nim);
      if (me && me.approved === false) return { ok: false, message: 'Keanggotaan Anda masih menunggu persetujuan dosen.' };
      if (mine.id !== g.id) return { ok: false, message: 'Anda sudah tergabung di kelompok lain. Usulan hanya dapat diajukan untuk kelompok Anda sendiri.' };
    }
    return { ok: true };
  }
  const me = g.members.find(m => m.nim === nim);
  if (!me || me.approved === false) return { ok: false, message: 'Hanya anggota kelompok ini yang dapat mengajukan anggota.' };
  return { ok: true };
}

/* Proyek kelas (kelompok) yang masih punya kelompok belum lengkap dan belum diikuti mahasiswa */
function openProposalProjectsForStudent(nim) {
  return (db.projects || []).filter(p =>
    isCourseProject(p) && isGroupProject(p) && p.status === STATUS_ACTIVE && !p.studentCreated &&
    isStudentInCourseScope(p, nim) && !findGroupByStudent(p, nim) &&
    (p.groups || []).some(g => !isGroupFull(p, g))
  );
}

/* ------------------------ STATUS APPROVAL ANGGOTA ------------------------- */
function isPendingMember(m) { return m && m.approved === false; }
function countPendingMembers(p) {
  if (!isGroupProject(p)) return (p.members || []).filter(isPendingMember).length;
  let n = 0;
  (p.groups || []).forEach(g => g.members.forEach(m => { if (isPendingMember(m)) n++; }));
  return n;
}

/* ---------------------- STATUS PENILAIAN (GRADING) ----------------------- */
function isGradableCategory(p) {
  return p && p.category === COURSE_CATEGORY;
}
function getProjectGradingMode(p) {
  const mode = p && p.gradingMode;
  if (['group', 'individual', 'both'].includes(mode)) return mode;
  return isIndividualCourseProject(p) ? 'individual' : 'group';
}
function isProjectFullyApproved(p) {
  if (isGroupProject(p)) {
    return (p.groups || []).some(g => g.milestones.length > 0 && g.milestones.every(m => m.status === 'Disetujui'));
  }
  return p.milestones.length > 0 && p.milestones.every(m => m.status === 'Disetujui');
}
function isGroupFullyApproved(g) {
  return g && g.milestones.length > 0 && g.milestones.every(m => m.status === 'Disetujui');
}

function isDocumentationComplete(target) {
  return !!target && Array.isArray(target.milestones) && target.milestones.length > 0
    && target.milestones.every(m => m.status === 'Disetujui');
}
// Proyek/kelompok baru dapat ditandai selesai setelah seluruh tahapan dokumentasi disetujui dosen.
function markProjectComplete(projectId, groupId) {
  const p = getProject(projectId);
  if (!p || !canApproveProject(p, 'lecturer', SEED.lecturer)) { showToast('Anda tidak berwenang menandai proyek ini selesai.', 'error'); return; }
  const target = groupId ? getGroup(p, groupId) : p;
  if (!target) return;
  if (!isDocumentationComplete(target)) { showToast('Setujui seluruh tahapan dokumentasi terlebih dahulu sebelum menandai selesai.', 'warn'); return; }
  target.completionConfirmed = true;
  target.completedAt = todayShort();
  target.completedBy = SEED.lecturer.name;
  if (!saveDB()) return;
  render(); showToast(`Seluruh tahapan ${groupId ? 'kelompok' : 'proyek'} ditandai selesai. Penilaian kini dapat dilakukan.`, 'success');
}
function setProjectGradingMode(projectId, mode) {
  const p = getProject(projectId);
  if (!p || !canApproveProject(p, 'lecturer', SEED.lecturer)) { showToast('Anda tidak berwenang mengubah opsi penilaian proyek ini.', 'error'); return; }
  if (!['group','individual','both'].includes(mode)) return;
  p.gradingMode = mode;
  if (!saveDB()) return;
  render();
}
function getGrade(target) {
  return target && target.grade ? target.grade : null;
}
// Mengubah nilai numerik menjadi predikat huruf yang dipakai pada fitur penilaian proyek.
function scoreToLetter(score) {
  if (score >= 85) return 'A';
  if (score >= 80) return 'A-';
  if (score >= 75) return 'B+';
  if (score >= 70) return 'B';
  if (score >= 65) return 'B-';
  if (score >= 60) return 'C+';
  if (score >= 55) return 'C';
  if (score >= 50) return 'C-';
  if (score >= 40) return 'D';
  return 'E';
}
function gradeColorClass(letter) {
  if (!letter) return 'badge-neutral';
  if (letter.startsWith('A')) return 'badge-success';
  if (letter.startsWith('B')) return 'badge-info';
  if (letter.startsWith('C')) return 'badge-warning';
  return 'badge-danger';
}

/* ============================================================================
   ROLE-BASED ACCESS CONTROL (RBAC) — VISIBILITAS PROYEK
   ========================================================================== */

// Aturan visibilitas ini mempertahankan pemisahan proyek umum, mata kuliah, dan IUM sesuai versi HTML asal.
function canViewProject(p, role, identity) {
  if (!p || (role !== 'student' && role !== 'lecturer')) return false;

  const cat = p.category;

  /* 1. Proyek kategori umum — semua pengguna dapat melihat */
  if (isPublicConfiguredCategory(cat)) return true;

  /* 2. Proyek "Proyek Mata Kuliah" — hanya mahasiswa yang mengambil MK tsb,
        dosen pengampu/pembimbing MK tsb. */
  if (cat === COURSE_CATEGORY) {
    if (role === 'lecturer') {
      const nip = identity && identity.nip;
      if (p.supervisorNip && nip && p.supervisorNip === nip) return true;
      if (p.creatorNip && nip && p.creatorNip === nip) return true;
      return false;
    }
    if (role === 'student') {
      const nim = identity && identity.nim;
      if (!nim) return false;
      if (p.creatorNim === nim) return true;
      /* Proyek kelas aktif: seluruh mahasiswa yang terdaftar di kelas & angkatan tsb */
      if (p.status === STATUS_ACTIVE && !p.studentCreated) {
        const sAngkatan = studentAngkatan(nim);
        const sKelas = studentKelas(nim);
        const matchAngkatan = !p.angkatan || p.angkatan === sAngkatan;
        const matchKelas = !Array.isArray(p.kelas) || p.kelas.length === 0 || p.kelas.includes(sKelas);
        if (matchAngkatan && matchKelas && studentTakesCourse(nim, p.course)) return true;
      }
      if (isGroupProject(p)) {
        return (p.groups || []).some(g => g.members.some(m => m.nim === nim));
      }
      return (p.members || []).some(m => m.nim === nim)
          || (p.applicants || []).some(a => a.nim === nim);
    }
    return false;
  }

  /* 3. Proyek "Informatika Untuk Masyarakat" */
  if (cat === COMMUNITY_CATEGORY) {
    if (role === 'lecturer') {
      const nip = identity && identity.nip;
      if (p.supervisorNip && nip && p.supervisorNip === nip) return true;
      if (p.creatorNip && nip && p.creatorNip === nip) return true;
      return false;
    }
    if (role === 'student') {
      const nim = identity && identity.nim;
      if (!nim) return false;
      if (p.creatorNim === nim) return true;
      if (isGroupProject(p)) {
        return (p.groups || []).some(g => g.members.some(m => m.nim === nim));
      }
      return (p.members || []).some(m => m.nim === nim)
          || (p.applicants || []).some(a => a.nim === nim);
    }
    return false;
  }

  return true;
}

function canApproveProject(p, role, identity) {
  if (!p || role !== 'lecturer') return false;
  const nip = String((identity && identity.nip) || '');
  // Usulan yang sudah memilih dosen hanya dapat ditinjau oleh dosen tersebut.
  if (p.status === 'Diajukan' && !p.ownerNip) {
    const assignedNip = String(p.supervisorNip || '').trim();
    return !!nip && (!assignedNip || assignedNip === nip);
  }
  // Setelah disetujui, hanya dosen pemilik yang dapat mengelola proyek.
  if (p.ownerNip) return !!nip && String(p.ownerNip) === nip;
  if (isPublicMarketplaceProject(p)) {
    return !!nip && (String(p.supervisorNip || '') === nip
      || String(p.creatorNip || '') === nip
      || (identity && identity.name && (p.supervisor === identity.name || p.creator === identity.name)));
  }
  if (p.category === COURSE_CATEGORY || p.category === COMMUNITY_CATEGORY) {
    return !!nip && (String(p.supervisorNip || '') === nip || String(p.creatorNip || '') === nip);
  }
  return true;
}

function canGradeProject(p, role, identity) {
  if (!p || p.category !== COURSE_CATEGORY || role !== 'lecturer') return false;
  const nip = identity && identity.nip;
  return !!nip && (p.supervisorNip === nip || p.creatorNip === nip);
}

function isSupervisingLecturer(p, identity) {
  if (!p || !identity) return false;
  const nip = identity.nip;
  if (!nip) return false;
  if (p.supervisorNip && p.supervisorNip === nip) return true;
  if (p.creatorNip && p.creatorNip === nip) return true;
  return false;
}

function hydrateSeedProject(p) {
  const mem = m => Object.assign(seedStudent(m.nim), { role: m.role || 'Anggota', approved: m.approved !== false },

  const q = Object.assign({}, p);
  q.isGroup = !!p.isGroup;
  q.members = (p.members || []).map(mem);
  q.applicants = (p.applicants || []).map(a => Object.assign(seedStudent(a.nim), { prodi: seedStudent(a.nim).prodi }, a));
  q.groups = (p.groups || []).map(g => ({ id: g.id, name: g.name, members: (g.members || []).map(mem), milestones: buildMilestones(g.milestones || {}), guidance: g.guidance || [], ...(g.grade ? { grade: g.grade } : {}) }));
  q.milestones = q.isGroup ? [] : buildMilestones(p.milestones || {});
  q.guidance = p.guidance || [];
  if (p.grade) q.grade = p.grade;

}

/* -------------------- NORMALISASI PROYEK & KELOMPOK ----------------------- */
function normalizeProject(p) {
  if (!p) return p;
  p.members = Array.isArray(p.members) ? p.members : [];
  p.applicants = Array.isArray(p.applicants) ? p.applicants : [];
  p.guidance = Array.isArray(p.guidance) ? p.guidance : [];
  p.members.forEach(m => { if (typeof m.approved !== 'boolean') m.approved = true; });

  p.isGroup = !!p.isGroup;
  if (!p.isGroup) {
    p.groups = [];
    p.milestones = Array.isArray(p.milestones) ? p.milestones : [];
    if (p.grade && typeof p.grade !== 'object') p.grade = null;
  } else {
    p.milestones = [];
    p.groups = Array.isArray(p.groups) ? p.groups : [];
    p.groups.forEach(g => {
      g.id = g.id || uid('GRP');
      g.name = g.name || 'Kelompok';
      g.members = Array.isArray(g.members) ? g.members : [];
      g.members.forEach(m => { if (typeof m.approved !== 'boolean') m.approved = true; });
      g.milestones = Array.isArray(g.milestones) ? g.milestones : [];
      g.guidance = Array.isArray(g.guidance) ? g.guidance : [];
      if (g.grade && typeof g.grade !== 'object') g.grade = null;
    });
  }
  if (typeof p.groupCount !== 'number') p.groupCount = p.isGroup ? p.groups.length : 0;
  if (typeof p.membersPerGroup !== 'number') p.membersPerGroup = 0;
  // Nilai jumlah anggota disimpan minimal 1. Kategori privat (Proyek Mata Kuliah/IUM)
  // tetap tidak menggunakan angka ini sebagai batas pendaftaran total.
  if ([COURSE_CATEGORY, COMMUNITY_CATEGORY].includes(p.category) && (!Number.isFinite(Number(p.membersNeeded)) || Number(p.membersNeeded) < 1)) {
    const assigned = p.isGroup ? (p.groups || []).reduce((n, g) => n + (g.members || []).length, 0) : p.members.length;
    p.membersNeeded = Math.max(1, assigned);
  }
  if (p.category === COURSE_CATEGORY && !p.angkatan) p.angkatan = '';
  return p;
}

    username:(previousAdmin && previousAdmin.username) || adminTemplate.username || 'admin',
    password:(previousAdmin && previousAdmin.password) || adminTemplate.password || 'password123',

      gpa:Number.isFinite(previousGpa) && previousGpa >= 0 && previousGpa <= 4
        ? Number(previousGpa.toFixed(2)) : Number((3.25 + (index % 7) * 0.1).toFixed(2)),
      mexs:Number(previous && previous.mexs) || 0,
      portfolioCount:Number(previous && previous.portfolioCount) || 0,
      achievementCount:Number(previous && previous.achievementCount) || 0,

function cleanupLegacyDemoRecords() {
  if (!db) return;
  const studentNims = new Set((db.users || []).filter(u => u.role === 'student').map(u => String(u.nim || u.username || '')));
  const lecturerNips = new Set((db.users || []).filter(u => u.role === 'lecturer').map(u => String(u.nip || u.username || '')));
  const canonicalSeedProjects = (SEED.projects || [])
    .filter(project => DEMO_INTERACTION_PROJECT_IDS.has(String(project.id || '')))
    .map(project => JSON.parse(JSON.stringify(project)));

  // Reset satu kali seluruh daftar proyek lama ke enam proyek demo yang ditetapkan.
  // Ini juga menghapus ID proyek lawas yang tidak lagi ada dalam seed saat ini, serta
  // proyek uji lama yang pemiliknya masih memakai akun dosen/mahasiswa aktif.
  // Setelah migrasi selesai, proyek baru yang dibuat lewat fitur aplikasi tetap tersimpan.
  db.projects = canonicalSeedProjects;
  const remainingProjectIds = new Set(db.projects.map(project => String(project.id || '')));
  db.projects.forEach(project => {
    project.members = (project.members || []).filter(member => member && studentNims.has(String(member.nim || '')));
    project.applicants = (project.applicants || []).filter(member => member && studentNims.has(String(member.nim || '')));
    (project.groups || []).forEach(group => {
      group.members = (group.members || []).filter(member => member && studentNims.has(String(member.nim || '')));
    });
  });

  // Hapus rekam jejak/invitation/profil yatim milik akun lama.
  db.achievements = (db.achievements || []).filter(item => item && studentNims.has(String(item.nim || '')));
  db.portfolios = (db.portfolios || []).filter(item => item && studentNims.has(String(item.nim || '')));
  db.invitations = (db.invitations || []).filter(item => item && studentNims.has(String(item.nim || '')) &&
    (!item.projectId || remainingProjectIds.has(String(item.projectId))));
  db.notifications = (db.notifications || []).filter(item => {
    if (!item) return false;
    const studentNim = item.recipientNim || item.studentNim || item.nim;
    const lecturerNip = item.recipientNip || item.lecturerNip;
    const projectId = item.projectId || item.relatedProjectId;
    if (studentNim && !studentNims.has(String(studentNim))) return false;
    if (lecturerNip && !lecturerNips.has(String(lecturerNip))) return false;
    if (projectId && !remainingProjectIds.has(String(projectId))) return false;
    return true;
  });
  db.studentProfiles = db.studentProfiles && typeof db.studentProfiles === 'object' ? db.studentProfiles : {};
  Object.keys(db.studentProfiles).forEach(nim => { if (!studentNims.has(String(nim))) delete db.studentProfiles[nim]; });
}

// Memuat data terakhir dari cache; saat halaman dibuka, startup lebih dulu meminta data terbaru dari Django.
function loadDB() {
  try {
    const raw=localStorage.getItem(STORAGE_KEY); db=raw?JSON.parse(raw):JSON.parse(JSON.stringify(SEED));
    if(!db||typeof db!=='object') throw new Error('Data lokal tidak valid.');
    db.admin=db.admin||JSON.parse(JSON.stringify(SEED.admin));
    const ADMIN_AVATAR='https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&w=150&q=80';
    if(!isNonEmpty(db.admin.avatar||'',500) || !/^https?:\/\//i.test(db.admin.avatar)) db.admin.avatar=ADMIN_AVATAR;
    db.admin.name=db.admin.name||SEED.admin.name;
    db.admin.nip=db.admin.nip||SEED.admin.nip;
    db.admin.prodi=db.admin.prodi||SEED.admin.prodi;
    db.admin.email=db.admin.email||SEED.admin.email;
    db.users=Array.isArray(db.users)?db.users:JSON.parse(JSON.stringify(SEED.users));
    const rosterMigrationRan = ensureCanonicalDemoAccounts();
    const projectCleanupMigrationRan = Number(db.demoProjectCleanupVersion || 0) < 1;
    db.announcements=Array.isArray(db.announcements)?db.announcements:JSON.parse(JSON.stringify(SEED.announcements));
    db.talentPool=Array.isArray(db.talentPool)?db.talentPool:JSON.parse(JSON.stringify(SEED.talentPool));
    db.projects=Array.isArray(db.projects)?db.projects:JSON.parse(JSON.stringify(SEED.projects));
    // Hapus profil talenta yatim dari versi lama yang sudah tidak memiliki akun mahasiswa di pengelolaan Admin.
    const knownStudentNims = new Set((db.users || []).filter(u => u.role === 'student' && u.active && u.nim).map(u => String(u.nim)));
    db.talentPool = db.talentPool.filter(t => t && knownStudentNims.has(String(t.nim || '')));
    db.achievements=Array.isArray(db.achievements)?db.achievements:JSON.parse(JSON.stringify(SEED.achievements));
    db.achievements = db.achievements.filter(a => a &&
      !DEMO_ACHIEVEMENT_IDS.has(String(a.id || '')) &&
      !DEMO_ACHIEVEMENT_TITLES.has(String(a.title || '')));
    db.portfolios=Array.isArray(db.portfolios)?db.portfolios:JSON.parse(JSON.stringify(SEED.portfolios));
    // Migrasi data lama: rekam jejak dan portofolio contoh hanya milik akun mahasiswa demo awal.
    db.achievements.forEach(a => { if (!a.nim) a.nim = LEGACY_DEMO_STUDENT_NIM; if (!a.proofFileId) a.proofFileId = ''; });

    db.invitations=Array.isArray(db.invitations)?db.invitations:JSON.parse(JSON.stringify(SEED.invitations));
    db.invitations.forEach(inv => { if (!inv.nim) inv.nim = LEGACY_DEMO_STUDENT_NIM; });
    db.notifications=Array.isArray(db.notifications)?db.notifications:JSON.parse(JSON.stringify(SEED.notifications));
    db.notifications.forEach(notification => {
      if (!notification || typeof notification !== 'object') return;
      if (!notification.readBy || typeof notification.readBy !== 'object' || Array.isArray(notification.readBy)) notification.readBy = {};
      // Status baca versi lama bersifat global dan tidak menyimpan identitas pembaca.
      // Saat migrasi, pertahankan status lama hanya untuk akun demo mahasiswa awal;
      // akun lain akan memiliki status baca mandiri.
      if (notification.read === true && !Object.keys(notification.readBy).length) {
        notification.readBy[`student:${LEGACY_DEMO_STUDENT_NIM}`] = true;
      }
      delete notification.read;
    });
    db.skpiFinalizations=Array.isArray(db.skpiFinalizations)?db.skpiFinalizations:[];
    delete db.skpiFinalizationRequests;
    db.masterData=db.masterData||{};
    db.masterData.projectCategories=Array.isArray(db.masterData.projectCategories)?db.masterData.projectCategories:[...DEFAULT_PROJECT_CATEGORIES];
    // Migrasi label kategori lama agar data yang tersimpan di browser tetap terbaca.
    const legacyCourseCategory = 'Tugas Mata Kuliah';
    db.masterData.projectCategories = [...new Set(db.masterData.projectCategories.map(c => c === legacyCourseCategory ? COURSE_CATEGORY : c))];
    db.projects.forEach(project => { if (project.category === legacyCourseCategory) project.category = COURSE_CATEGORY; });
    db.masterData.courses=Array.isArray(db.masterData.courses)?db.masterData.courses:[...SEED.masterData.courses];
    db.masterData.courseOfferings=Array.isArray(db.masterData.courseOfferings)?db.masterData.courseOfferings:JSON.parse(JSON.stringify(SEED.masterData.courseOfferings));
    if (rosterMigrationRan || projectCleanupMigrationRan) {
      db.masterData.courses = [...SEED_DUMMY.courses];
      db.masterData.courseOfferings = JSON.parse(JSON.stringify(SEED_DUMMY.courseOfferings));
      cleanupLegacyDemoRecords();
      db.demoProjectCleanupVersion = 1;
      // Normalisasi data browser lama agar label KKN tidak muncul kembali pada akun/proyek yang sah.
      const normalizeCommunityCourseLabel = value => isCommunityCourseName(value) ? COMMUNITY_CATEGORY : value;
      db.masterData.courses = db.masterData.courses.map(normalizeCommunityCourseLabel);
      db.masterData.courseOfferings.forEach(item => { item.course = normalizeCommunityCourseLabel(item.course); });
      db.users.forEach(user => {
        if (Array.isArray(user.mataKuliahDiambil)) user.mataKuliahDiambil = user.mataKuliahDiambil.map(normalizeCommunityCourseLabel);
        if (Array.isArray(user.mataKuliahDiampu)) user.mataKuliahDiampu.forEach(item => { item.course = normalizeCommunityCourseLabel(item.course); });
        if (typeof user.mataKuliah === 'string') {
          user.mataKuliah = user.mataKuliah.split(',').map(course => normalizeCommunityCourseLabel(course.trim())).join(', ');
        }
      });
      db.projects.forEach(project => {
        if (project.category && isCommunityCourseName(project.category)) project.category = COMMUNITY_CATEGORY;
        if (project.course && isCommunityCourseName(project.course)) project.course = COMMUNITY_CATEGORY;
      });
      db.talentPool.forEach(talent => {
        if (Array.isArray(talent.skills)) talent.skills = talent.skills.map(normalizeCommunityCourseLabel);
      });

// Menyimpan data aplikasi ke cache browser dan menjadwalkan salinan utama ke database Django.
// Fungsi tetap mengembalikan boolean secara langsung agar seluruh tombol UI lama bekerja seperti sebelumnya.
function saveDB() {
  let snapshot;
  try {
    snapshot = JSON.stringify(db);
    localStorage.setItem(STORAGE_KEY, snapshot); // Cache lokal membantu ketika jaringan terputus sementara.
  } catch (error) {
    console.error('KREASI: gagal membuat salinan data', error);
    if (document.readyState !== 'loading') showToast('Perubahan gagal disiapkan untuk disimpan.', 'error');
    return false;
  }
  pendingServerSave = pendingServerSave.catch(() => null).then(async () => {
    const response = await apiRequest('/api/state/', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: JSON.parse(snapshot) })
    });
    if (!response.ok) {
      const result = await response.json().catch(() => ({}));
      // Saat halaman baru dibuka belum ada sesi; kegagalan sinkron awal ditangani lagi setelah login.
      if (state.userRole) showToast(result.error || 'Data belum berhasil disinkronkan ke server.', 'error');
      throw new Error(result.error || `Server menolak penyimpanan (${response.status}).`);
    }
    return true;
  }).catch(error => {
    console.warn('KREASI: sinkronisasi Django tertunda/gagal:', error.message);
    return false;
  });
  return true;
}

// Menunggu antrean data selesai sebelum proses login agar data dummy awal sudah tersimpan di server.
async function waitForServerSave() {
  await pendingServerSave.catch(() => false);
}

// Memastikan login demo yang sudah divalidasi antarmuka juga tercatat pada sesi Django.
async function createServerSession(username, password) {
  await waitForServerSave();
  const response = await apiRequest('/api/session/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(result.error || 'Sesi Django tidak dapat dibuat.');
  return result;
}

// Menghapus sesi server saat pengguna menyelesaikan proses keluar dari portal.
function clearServerSession() {
  apiRequest('/api/session/logout/', { method: 'POST' }).catch(error => {
    console.warn('KREASI: sesi server tidak berhasil dihapus:', error.message);
  });
}

  const nim = String(SEED.student.nim || '');
  return db.projects.filter(p => {
    // Usulan yang belum disetujui tetap berada di Bursa Proyek, bukan ruang kerja.
    if (!p || p.status === 'Ditolak' || p.status === 'Diajukan') return false;
    if (String(p.creatorNim || '') === nim) return true;
    // Pelamar yang sudah diterima menjadi bagian dari Proyek Saya meskipun data lama
    // belum tersinkron ke daftar members/groups.
    if ((p.applicants || []).some(a => String(a.nim || '') === nim && ['Diterima', 'Accepted'].includes(String(a.status || '')))) return true;
    if (isGroupProject(p)) return (p.groups || []).some(g => (g.members || []).some(m => String(m.nim || '') === nim && m.approved !== false));
    return (p.members || []).some(m => String(m.nim || '') === nim && m.approved !== false);
  });
}

function isProjectReadyForStudentProgress(project, nim = SEED.student.nim) {
  if (!project || !['Active', 'Open'].includes(project.status)) return false;
  const studentNim = String(nim || '');
  if (isGroupProject(project)) {
    const assignedGroups = (project.groups || []).filter(g => (g.members || []).some(m => String(m.nim || '') === studentNim));
    const relevantGroups = assignedGroups.length ? assignedGroups
      : String(project.creatorNim || '') === studentNim ? (project.groups || []) : [];
    return relevantGroups.some(g => Array.isArray(g.milestones) && g.milestones.length > 0);
  }
  return Array.isArray(project.milestones) && project.milestones.length > 0;
}
function projectProgress(p) {
  if (isGroupProject(p)) return groupProjectProgress(p);
  const total = p.milestones.length;
  const done = p.milestones.filter(m => m.status === 'Disetujui').length;
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}
function pendingMilestones() {
  let n = 0;
  const scope = state.userRole === 'lecturer' ? db.projects.filter(p => canViewProject(p, 'lecturer', SEED.lecturer)) : db.projects;
  scope.forEach(p => {
    if (isGroupProject(p)) {
      (p.groups||[]).forEach(g => g.milestones.forEach(m => { if (m.status === 'Menunggu Verifikasi') n++; }));
    } else {
      p.milestones.forEach(m => { if (m.status === 'Menunggu Verifikasi') n++; });
    }
  });
  return n;
}
function notificationAccountKey(role = state.userRole) {
  if (role === 'student') return `student:${String(SEED.student.nim || '')}`;
  if (role === 'lecturer') return `lecturer:${String(SEED.lecturer.nip || '')}`;
  if (role === 'admin') return `admin:${String(db?.admin?.nip || db?.admin?.username || 'admin')}`;
  return `${String(role || 'guest')}:anonymous`;
}
function isNotificationRead(notification, role = state.userRole) {
  return !!(notification && notification.readBy && notification.readBy[notificationAccountKey(role)]);
}
function markNotificationRead(notification, role = state.userRole) {
  if (!notification) return;
  if (!notification.readBy || typeof notification.readBy !== 'object' || Array.isArray(notification.readBy)) notification.readBy = {};
  notification.readBy[notificationAccountKey(role)] = true;
}
function unreadNotif() {
  return notificationsForRole(state.userRole).filter(n => !isNotificationRead(n, state.userRole)).length;
}

  const container = $('toast-container');

    error:['bg-rose-600','fa-circle-exclamation'],
    info:['bg-slate-800','fa-circle-info'],

  }[type] || ['bg-slate-800','fa-circle-info'];

  const el = document.createElement('div');
  el.className = `${cfg[0]} text-white px-4 py-3 rounded-2xl flex items-start gap-3 text-sm font-medium transition-all duration-300 translate-y-2 opacity-0 max-w-sm shadow-lg`;
  el.setAttribute('role', 'status');

/* Tentukan halaman tujuan notifikasi sesuai peran aktif dan jenis aktivitas. */
function notificationDestination(n, role = state.userRole) {
  const text = `${n?.title || ''} ${n?.body || ''}`.toLocaleLowerCase('id-ID');
  const isAchievement = /prestasi|mexs|validasi prestasi/.test(text);
  const isAccount = /akun|kata sandi|reset sandi|pengguna baru/.test(text);
  const isAnnouncement = /pengumuman/.test(text);
  const isSkpi = /skpi|surat keterangan pendamping ijazah/.test(text);
  const isProfile = /kesalahan data dosen|profil dosen/.test(text);
  const isProject = /proyek|dokumentasi|kelompok|anggota|pelamar|kolaborasi|pendaftaran|undangan|laporan|tahap|bimbingan|nilai akhir|dokumen diunggah|kegiatan/.test(text);

  if (role === 'admin') {
    if (isAchievement) return { menu:'validation' };
    if (isAccount) return { menu:'users' };
    if (isAnnouncement) return { menu:'announcements' };
    if (isSkpi) return { menu:'skpi' };
    if (isProfile) return { menu:'users' };
    // Akses admin ke semua halaman proyek memang telah dinonaktifkan.
    if (isProject) return { menu:'dashboard', restrictedProject:true };
    return { menu:'dashboard' };
  }
  if (role === 'lecturer') {
    if (isProfile) return { menu:'profile' };
    if (isProject) return { menu:'projects' };
    return { menu:'dashboard' };
  }
  if (role === 'student') {
    if (isAchievement) return { menu:'achievements' };
    if (isSkpi) return { menu:'skpi' };
    if (isProject) {
      return { menu: /dokumen|anggota|kelompok|catatan bimbingan|nilai akhir|bergabung|diterima sebagai anggota|pelamar diterima|pelamar ditolak|pendaftaran proyek|usulan proyek (disetujui|ditolak)|proyek kelas diaktifkan/.test(text) ? 'myprojects' : 'projects' };
    }
    return { menu:'dashboard' };
  }
  return { menu:'dashboard' };
}

function openNotificationDestination(notificationId) {
  const n = notificationsForRole(state.userRole).find(item => String(item.id) === String(notificationId));
  if (!n) { closeModal(); showToast('Notifikasi tidak ditemukan atau bukan untuk akun ini.', 'warn'); return; }
  markNotificationRead(n, state.userRole);
  saveDB();
  closeModal();
  const destination = notificationDestination(n);
  if (state.userRole === 'admin') {
    setAdminMenu(destination.menu);
    if (destination.restrictedProject) showToast('Akses administrator ke halaman proyek telah dinonaktifkan.', 'info');
    return;
  }
  if (state.userRole === 'lecturer') { setLecturerMenu(destination.menu); return; }
  if (state.userRole === 'student') { setStudentMenu(destination.menu); return; }
  showToast('Silakan masuk untuk membuka halaman terkait.', 'info');
}
function markAllRead() {
  notificationsForRole(state.userRole).forEach(n => markNotificationRead(n, state.userRole));
  saveDB(); closeModal(); render();
  showToast('Semua notifikasi untuk akun ini ditandai telah dibaca.', 'info');
}
function pushNotif(title, body, options = {}) {
  const notification = { id: uid('n'), title, body, time: todayShort(), readBy: {} };
  if (options && options.recipientRole) notification.recipientRole = options.recipientRole;
  if (options && options.recipientNim) notification.recipientNim = String(options.recipientNim);
  if (options && options.recipientNip) notification.recipientNip = String(options.recipientNip);
  if (options && options.projectId) notification.projectId = String(options.projectId);
  db.notifications.unshift(notification);
  saveDB();
  return notification;
}

function notificationsForRole(role = state.userRole) {
  const identity = role === 'student' ? String(SEED.student.nim || '')
    : role === 'lecturer' ? String(SEED.lecturer.nip || '') : '';
  return (db.notifications || []).filter(n => {
    if (n.recipientRole && n.recipientRole !== role) return false;
    if (n.recipientNim && String(n.recipientNim) !== identity) return false;
    if (n.recipientNip && String(n.recipientNip) !== identity) return false;
    if (role === 'admin' && notificationDestination(n, 'admin').restrictedProject) return false;
    return true;
  });
}

  const myInvitations = db.invitations.filter(inv => String(inv.nim || LEGACY_DEMO_STUDENT_NIM) === String(SEED.student.nim) && inv.status === 'Menunggu Respon');
  openModal({

// Router UI lama memilih portal berdasarkan peran dan menu aktif, sehingga tampilan tidak perlu dirancang ulang.
function render() {
  const app = $('app');
  if (state.currentView === 'landing')       app.innerHTML = renderLanding();
  else if (state.currentView === 'login')    app.innerHTML = renderLogin();
  else if (state.currentView === 'student')  app.innerHTML = renderStudentShell();
  else if (state.currentView === 'lecturer') app.innerHTML = renderLecturerShell();
  else if (state.currentView === 'admin')    app.innerHTML = renderAdminShell();
  initializeFilePickers(app);
}

function switchView(v) {
  state.currentView = v;
  state.q = '';
  if (v === 'login') state.loginRole = 'student';
  render();
}
function scrollToSection(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}
function toggleMobileNav() {
  state.mobileNav = !state.mobileNav;
  render();
}
function handleSearch(v) {
  state.q = v.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('[data-search]').forEach(el => {
    const hay = (el.getAttribute('data-search') || '').toLowerCase();
    const show = state.q === '' || hay.includes(state.q);
    el.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  const empty = $('search-empty');
  if (empty) empty.classList.toggle('hidden', visible > 0);
}

async function handleLoginSubmit(e) {
  e.preventDefault();
  try {
    const username = ($('login-username')?.value || '').trim();
    const password = $('login-password')?.value || '';
    if (!username && !password) { showToast('Username dan kata sandi wajib diisi.', 'error'); return; }
    if (!username) { showToast('Username wajib diisi.', 'error'); $('login-username')?.focus(); return; }
    if (!password) { showToast('Kata sandi wajib diisi.', 'error'); $('login-password')?.focus(); return; }
    const user = getUser(username);
    if (!user) { showToast('Username tidak terdaftar di sistem.', 'error'); $('login-username')?.focus(); return; }
    if (user.password !== password) { showToast('Kata sandi salah. Periksa kembali kata sandi Anda.', 'error'); $('login-password')?.focus(); return; }
    if (!user.active) { showToast('Akun sedang nonaktif. Hubungi administrator untuk mengaktifkannya.', 'error'); return; }
    if (user.role !== state.loginRole) { showToast('Akun ini tidak sesuai dengan peran login yang dipilih.', 'error'); return; }
    // Validasi sesi di Django menjaga agar proses simpan data berikutnya memakai sesi yang sah.
    try { await createServerSession(username, password); } catch (sessionError) { showToast(sessionError.message || 'Login ke server gagal.', 'error'); return; }
    if (user.role === 'lecturer') {
      Object.assign(SEED.lecturer, {
        nip:user.nip, name:user.name, email:user.email || '', avatar:user.avatar || SEED.student.avatar,
        prodi:user.prodi || 'S1 Informatika', jabatanFungsional:user.jabatanFungsional || '',
        nidn:user.nidn || '', gelar:user.gelar || '',
        mataKuliahDiampu:Array.isArray(user.mataKuliahDiampu) ? user.mataKuliahDiampu : [],
        bidangKeahlian:Array.isArray(user.bidangKeahlian) ? user.bidangKeahlian : [],
        pendidikan:Array.isArray(user.pendidikan) ? user.pendidikan : [],
        publikasi:Array.isArray(user.publikasi) ? user.publikasi : []
      });
    } else if (user.role === 'student') {
      SEED.student.nim = user.nim;
      SEED.student.angkatan = user.angkatan || '';
      SEED.student.kelas = user.kelas || '-';
      if (user.avatar) SEED.student.avatar = user.avatar;
      syncStudentIdentityFromAdmin();
      const talent = db.talentPool.find(t => String(t.nim) === String(user.nim));
      SEED.student.gpa = talent && Number.isFinite(Number(talent.gpa)) ? Number(talent.gpa) : 0;
      SEED.student.semester = semesterForCohort(user.angkatan);
      activateStudentProfile(user.nim);
    }
    loginAs(user.role);
    saveDB(); // Mengirim normalisasi profil/identitas ke server setelah sesi login aktif.
  } catch (err) { console.error(err); showToast(AUTH_ERROR_MESSAGE, 'error'); }
}

function loginAs(role) {
  state.userRole = role;
  state.currentView = role === 'student' ? 'student' : role === 'lecturer' ? 'lecturer' : 'admin';
  state.activeStudentMenu = 'dashboard';
  state.activeLecturerMenu = 'dashboard';
  state.activeAdminMenu = 'dashboard';
  state.studentProjectId = null; state.studentGroupId = null;
  state.lecturerProjectId = null; state.lecturerGroupId = null;
  state.mobileNav = false;
  render();
  if (role === 'student') showToast(`Berhasil masuk sebagai Mahasiswa — ${SEED.student.name}`, 'success');
  else if (role === 'lecturer') showToast(`Berhasil masuk sebagai Dosen — ${SEED.lecturer.name}`, 'success');
  else showToast('Berhasil masuk sebagai Administrator — Rina Kartika Sari, S.Kom., M.Cs.', 'success');
}

function acceptInvitation(id) {
  const inv = db.invitations.find(i => i.id === id);
  if (!inv) return;
  const p = getProject(inv.projectId);
  if (p && isProjectAtCapacity(p) && !hasAppliedToProject(p, SEED.student.nim)) {
    showToast('Kuota total anggota proyek sudah penuh. Undangan belum dapat diterima.', 'warn');
    return;
  }
  if (p && !isGroupProject(p) && !p.members.some(m => m.nim === SEED.student.nim)) {
    p.members.push({ nim: SEED.student.nim, name: SEED.student.name, prodi: SEED.student.prodi, role: 'Anggota Tim', approved: true });
  }
  db.invitations = db.invitations.filter(i => i.id !== id);
  saveDB();
  pushNotif('Undangan diterima', `Anda bergabung ke proyek "${inv.projectTitle}".`);
  closeModal(); render();
  showToast('Undangan kolaborasi berhasil diterima.', 'success');
}
function rejectInvitation(id) {
  db.invitations = db.invitations.filter(i => i.id !== id);
  saveDB(); closeModal(); render();
  showToast('Undangan kolaborasi ditolak.', 'info');
}

function addSkill() {
  try {
    const input = $('new-skill');
    const val = (input?.value || '').trim().replace(/\s+/g, ' ');
    if (!isNonEmpty(val, 60)) { showToast('Keahlian wajib diisi dan maksimal 60 karakter.', 'error'); return; }
    if (SEED.student.skills.length >= 20) { showToast('Maksimal 20 keahlian dapat disimpan.', 'warn'); return; }
    if (SEED.student.skills.some(s => s.toLowerCase() === val.toLowerCase())) { showToast('Keahlian tersebut sudah terdaftar.', 'warn'); return; }
    SEED.student.skills.push(val);
    const profile = ensureStudentProfile(SEED.student.nim);

async function savePortfolio(e) {
  e.preventDefault();
  let storedFileId = null;
  try {
    const title = ($('po-title')?.value || '').trim();
    const category = ($('po-category')?.value || '').trim();
    const link = ($('po-link')?.value || '').trim();
    const desc = ($('po-desc')?.value || '').trim();
    const file = $('po-file')?.files?.[0];
    if (!isNonEmpty(title, 120) || !isNonEmpty(category, 60) || !isNonEmpty(desc, 500)) { showToast('Judul, kategori, dan deskripsi portofolio wajib diisi dengan benar.', 'error'); return; }
    if (link) {
      let url; try { url = new URL(link); } catch (_) { showToast('Tautan portofolio tidak valid.', 'error'); return; }
      if (!['http:', 'https:'].includes(url.protocol)) { showToast('Tautan harus menggunakan HTTP atau HTTPS.', 'error'); return; }
    }
    if (file && file.size > 5 * 1024 * 1024) { showToast('Ukuran berkas maksimal 5 MB.', 'error'); return; }
    if (file && !/\.(pdf|jpe?g|png)$/i.test(file.name)) { showToast('Format berkas portofolio harus PDF, JPG, atau PNG.', 'error'); return; }
    if (db.portfolios.some(p => String(p.nim || LEGACY_DEMO_STUDENT_NIM) === String(SEED.student.nim) && p.title.toLowerCase() === title.toLowerCase())) { showToast('Judul portofolio tersebut sudah terdaftar.', 'warn'); return; }

    if (file) storedFileId = await storeUploadedDocument(file, { purpose:'portfolio', nim:SEED.student.nim, title });
    const newPortfolio = { id:uid('p'), nim:SEED.student.nim, title, category, link, desc };
    if (file) {
      newPortfolio.file = { name:file.name, size:(file.size / 1024).toFixed(0) + ' KB', type:file.type || 'application/octet-stream' };
      newPortfolio.fileId = storedFileId;
    }
    db.portfolios.push(newPortfolio);
    syncTalentPoolRecord(SEED.student.nim);
    if (!saveDB()) {
      db.portfolios = db.portfolios.filter(p => p.id !== newPortfolio.id);
      if (storedFileId) await removeStoredDocument(storedFileId);
      return;
    }
    closeModal(); render(); showToast('Portofolio dan berkas fisiknya berhasil disimpan.', 'success');
  } catch (err) {
    if (storedFileId) { try { await removeStoredDocument(storedFileId); } catch (_) {} }
    console.error(err); showToast(err.message || 'Portofolio gagal disimpan.', 'error');
  }
}

async function submitAchievement(e) {
  e.preventDefault();
  if (isFinalized(SEED.student.nim)) {
    showToast('SKPI sudah difinalisasi. Pengajuan prestasi baru dikunci.', 'error');
    render();
    return;
  }
  let storedFileId = null;
  try {
    const title = ($('ach-title')?.value || '').trim();
    const category = ($('ach-category')?.value || '').trim();
    const organizer = ($('ach-organizer')?.value || '').trim();
    const dateVal = $('ach-date')?.value || '';
    const categoryRecord = (db.masterData.achievementCategories || []).find(c => c.name === category);
    const points = Number(categoryRecord && categoryRecord.points);
    const note = ($('ach-note')?.value || '').trim();
    const file = $('ach-file')?.files?.[0];
    if (!isNonEmpty(title, 150) || !isNonEmpty(category, 120) || !isNonEmpty(organizer, 150)) { showToast('Judul, kategori, dan penyelenggara wajib diisi.', 'error'); return; }
    if (!categoryRecord || !Number.isFinite(points) || points < 0 || points > 10000) { showToast('Kategori atau poin MEXS tidak valid. Periksa kategori prestasi pada Data Master.', 'error'); return; }
    if (!dateVal || Number.isNaN(new Date(dateVal).getTime())) { showToast('Tanggal prestasi wajib valid.', 'error'); return; }
    if (!file) { showToast('Dokumen bukti prestasi wajib dipilih.', 'error'); return; }
    if (file.size > 5 * 1024 * 1024) { showToast('Ukuran dokumen maksimal 5 MB.', 'error'); return; }
    if (!/\.(pdf|jpe?g|png)$/i.test(file.name)) { showToast('Dokumen bukti harus berformat PDF, JPG, atau PNG.', 'error'); return; }
    const dateStr = new Date(dateVal).toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' });
    const newAch = {
      id:'ACH-' + uid('REC').slice(-8), nim:SEED.student.nim,
      title, category, date:dateStr, organizer, points, proofFile:file.name, proofFileId:'',
      status:'Menunggu Validasi', validatedBy:'-', validatedAt:'-',
      note:note || 'Menunggu pengecekan dokumen oleh Admin.'
    };
    storedFileId = await storeUploadedDocument(file, { purpose:'achievement-proof', nim:SEED.student.nim, achievementId:newAch.id, title });
    newAch.proofFileId = storedFileId;
    db.achievements.unshift(newAch);
    syncTalentPoolRecord(SEED.student.nim);
    if (!saveDB()) {
      db.achievements = db.achievements.filter(a => a.id !== newAch.id);
      if (storedFileId) await removeStoredDocument(storedFileId);
      return;
    }
    pushNotif('Pengajuan prestasi baru', `${newAch.title} menunggu validasi dosen.`);
    saveDB(); render(); showToast('Pengajuan prestasi dan dokumen fisik berhasil disimpan.', 'success');
  } catch (err) {
    if (storedFileId) { try { await removeStoredDocument(storedFileId); } catch (_) {} }
    console.error(err); showToast(err.message || 'Pengajuan prestasi gagal diproses.', 'error');
  }
}

async function cancelStudentProjectProposal(projectId) {
  const idx = db.projects.findIndex(project => String(project.id) === String(projectId));
  const p = idx >= 0 ? db.projects[idx] : null;
  if (!canEditStudentProjectProposal(p)) { showToast('Usulan tidak dapat dibatalkan karena sudah diproses dosen atau bukan milik Anda.', 'error'); closeModal(); render(); return; }
  const attachmentId = p.attachment?.id || null;
  db.projects.splice(idx, 1);
  if (!saveDB()) { db.projects.splice(idx, 0, p); return; }
  if (attachmentId) { try { await removeStoredDocument(attachmentId); } catch (err) { console.warn('Berkas usulan lama tidak dapat dihapus:', err); } }
  closeModal(); render(); showToast('Usulan proyek berhasil dibatalkan.', 'success');
}

function toggleProjectRegistration(projectId) {
  const p = getProject(projectId);
  if (!p) { showToast('Proyek tidak ditemukan.', 'error'); return; }
  if (state.userRole !== 'lecturer' || !isManagedByActiveLecturer(p) || !isPublicMarketplaceProject(p) || p.status === 'Diajukan') {
    showToast('Anda hanya dapat mengubah pendaftaran proyek umum yang menjadi tanggung jawab Anda.', 'error');
    return;
  }

  const isClosed = !!p.registrationClosed || p.status === 'Closed';
  if (isClosed) {
    if (isProjectAtCapacity(p)) {
      showToast('Kuota proyek sudah penuh. Tambah kapasitas atau keluarkan anggota sebelum membuka pendaftaran.', 'warn');
      return;
    }
    p.status = 'Open';
    p.registrationClosed = false;
  } else {
    p.registrationClosed = true;
  }

  if (!saveDB()) return;
  closeModal();
  render();
  showToast(isClosed ? 'Pendaftaran proyek berhasil dibuka.' : 'Pendaftaran proyek berhasil ditutup.', 'success');
}

function submitProjectApplication(e, projectId) { e.preventDefault(); try { const p=getProject(projectId); if(!p){showToast('Proyek tidak ditemukan.','error');return;} const eligibility=canApplyToProject(p); if(!eligibility.ok){showToast(eligibility.message,'warn');closeModal();return;} const skills=($('ap-skills')?.value||'').trim(),role=($('ap-role')?.value||'').trim(),motivation=($('ap-motivation')?.value||'').trim(); if(!isNonEmpty(skills,250)){showToast('Keahlian relevan wajib diisi dan maksimal 250 karakter.','error');return;} if(!isNonEmpty(role,80)){showToast('Posisi yang dilamar wajib dipilih.','error');return;} if(!isNonEmpty(motivation,1000)){showToast('Motivasi wajib diisi dan maksimal 1.000 karakter.','error');return;} if(hasAppliedToProject(p,SEED.student.nim)){showToast('Anda sudah terdaftar atau sudah pernah mendaftar pada proyek ini.','warn');return;} p.applicants.push({id:uid('ap'),nim:SEED.student.nim,name:SEED.student.name,prodi:SEED.student.prodi,skills,role,motivation,status:'Pending'}); pushNotif('Pendaftaran proyek terkirim',`Pendaftaran Anda pada "${p.title}" sedang ditinjau.`);if(!saveDB())return;closeModal();render();showToast('Pendaftaran berhasil dikirim.','success'); }catch(err){console.error(err);showToast('Pendaftaran proyek gagal diproses.','error');} }

function collectStudentOptions() {
  // Daftar kandidat harus bersumber dari akun mahasiswa aktif yang dikelola Admin.
  // Data talentPool lama yang tidak lagi memiliki akun tidak boleh muncul sebagai pilihan anggota.
  return (db.users || [])
    .filter(u => u.role === 'student' && u.active && u.nim)
    .map(u => ({
      nim: String(u.nim),
      name: u.name || u.nim,
      prodi: u.prodi || '-',
      angkatan: String(u.angkatan || '').trim(),
      kelas: String(u.kelas || '').trim() || '-'
    }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

function currentStudentCohort() {
  const nim = String(SEED.student && SEED.student.nim || '');
  const account = (db.users || []).find(u => u.role === 'student' && String(u.nim || '') === nim && u.active);
  return String((account && account.angkatan) || (SEED.student && SEED.student.angkatan) || '').trim();
}

function isStudentCreatedProject(p) {
  if (!p) return false;
  if (p.creatorRole === 'Ketua Tim Mahasiswa') return true;
  const creatorId = String(p.creatorNim || '');
  return !!creatorId && (db.users || []).some(u => u.role === 'student' && String(u.nim || '') === creatorId);
}
function canEditStudentProjectProposal(p, nim = SEED.student.nim) {
  return !!p && state.userRole === 'student' && p.status === 'Diajukan' && !p.ownerNip
    && String(p.creatorNim || '') === String(nim || '') && isStudentCreatedProject(p);
}

function projectCreatorCohort(p) {
  if (!p) return '';
  const stored = String(p.creatorAngkatan || '').trim();
  if (stored) return stored;
  return String(studentAngkatan(p.creatorNim) || '').trim();
}

function filterProjectMemberCandidates(p, candidates) {
  const list = Array.isArray(candidates) ? candidates : [];
  if (!p) return list;
  if (p.category === COURSE_CATEGORY) return list.filter(s => isStudentInCourseScope(p, s.nim));
  if (isIumProject(p)) {
    const enrolled = list.filter(s => studentTakesCommunityCourse(s.nim));
    if (!isStudentCreatedProject(p)) return enrolled;
    const cohort = projectCreatorCohort(p);
    return cohort ? enrolled.filter(s => String(s.angkatan || '').trim() === cohort) : [];
  }
  if (!isStudentCreatedProject(p)) return list;
  const cohort = projectCreatorCohort(p);
  if (!cohort) return [];
  return list.filter(s => String(s.angkatan || '').trim() === cohort);
}

function isProjectMemberCandidateAllowed(p, nim) {
  if (!p || !nim) return false;
  const account = (db.users || []).find(u => u.role === 'student' && u.active && String(u.nim || '') === String(nim));
  if (!account) return false;
  if (p.category === COURSE_CATEGORY) return isStudentInCourseScope(p, nim);
  if (isIumProject(p) && !studentTakesCommunityCourse(nim)) return false;
  if (!isStudentCreatedProject(p)) return true;
  const cohort = projectCreatorCohort(p);
  return !!cohort && String(account.angkatan || '').trim() === cohort;
}

/* Filter mahasiswa berdasarkan mata kuliah, angkatan, dan kelas yang diampu dosen */
function courseScopeForLecturer(lecturerNip, course) {
  if (!lecturerNip || !course) return null;
  const assigned = getLecturerCourses(lecturerNip).filter(item => item.course === course);
  const offerings = ((db.masterData && db.masterData.courseOfferings) || [])
    .filter(item => item.course === course && item.lecturerNip === lecturerNip);
  if (!assigned.length && !offerings.length) return null;
  const angkatan = [...new Set([
    ...assigned.flatMap(item => item.angkatan || []),
    ...offerings.map(item => item.angkatan).filter(Boolean)
  ].map(String))].sort();
  const kelas = [...new Set([
    ...assigned.flatMap(item => item.kelas || []),
    ...offerings.map(item => item.kelas).filter(Boolean)
  ].map(String))].sort();
  return { course, angkatan, kelas };
}
function selectedProjectLecturerNip() {
  return state.userRole === 'student' ? ($('np-sc-dosen')?.value || '') : (activeLecturerRecord()?.nip || SEED.lecturer.nip);
}
function getFilteredStudentsForLecturer(course, angkatan, kelas, lecturerNip) {
  if (!course || !angkatan || !Array.isArray(kelas) || !kelas.length) return [];
  const lecturerCourse = courseScopeForLecturer(lecturerNip, course);
  if (!lecturerCourse || !(lecturerCourse.angkatan || []).includes(angkatan) ||
      kelas.some(k => !(lecturerCourse.kelas || []).includes(k))) return [];
  return (db.users || [])
    .filter(u => u.role === 'student' && u.active && u.nim)
    .filter(u => {
      const enrolledCourses = studentCourses(u.nim);
      const matchCourse = enrolledCourses === null || enrolledCourses.includes(course);
      return matchCourse && u.angkatan === angkatan && kelas.includes(u.kelas);
    })
    .map(u => ({ nim: u.nim, name: u.name, prodi: u.prodi || '-', angkatan: u.angkatan || '-', kelas: u.kelas || '-' }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

function lecturerOptions() {
  return db.users.filter(u => u.role === 'lecturer' && u.active);
}

function activeLecturerRecord() {
  const nip = SEED.lecturer && SEED.lecturer.nip;
  return db.users.find(u => u.role === 'lecturer' && u.nip === nip) || null;
}

function nextProjectId() {
  const year = new Date().getFullYear();
  const prefix = `PRJ-${year}-`;
  const max = (db.projects || []).reduce((n, project) => {
    const id = String(project.id || '');
    if (!id.startsWith(prefix)) return n;
    const suffix = Number.parseInt(id.slice(prefix.length), 10);
    return Number.isFinite(suffix) ? Math.max(n, suffix) : n;
  }, 0);
  return `${prefix}${String(max + 1).padStart(3, '0')}`;
}

  return 'Publikasikan Proyek';
}

  const generalGroupFields = $('np-general-group-fields');
  const slotsWrap = $('np-slots-wrap');
  if (courseFields) courseFields.classList.toggle('hidden', !(isCourse && (state.userRole === 'lecturer' || state.userRole === 'student')));
  if (generalFields) generalFields.classList.toggle('hidden', isCourse);
  ['np-mitra', 'np-lokasi'].forEach(id => {
    const field = $(id);
    if (!field) return;
    field.disabled = isCourse;
    field.required = !isCourse;
  });
  const isStudentCourse = isCourse && state.userRole === 'student';
  if (generalGroupFields) generalGroupFields.classList.remove('hidden');
  const scFields = $('np-student-course-fields');
  if (scFields) scFields.classList.toggle('hidden', !isStudentCourse);
  if (isStudentCourse) renderStudentCourseFields();
  if (isCourse) { renderCourseAngkatanOptions(); renderCourseClassOptions(); }
  const gHint = $('np-isgroup-hint');
  if (gHint) gHint.textContent = isCourse
    ? 'Aktifkan jika tugas dikerjakan berkelompok.'
    : 'Cocok untuk lomba tim atau IUM yang dipecah menjadi beberapa kelompok.';
  if (slotsWrap) slotsWrap.classList.toggle('hidden', isCourse || sel.value === COMMUNITY_CATEGORY);
  if (isCourse) {
    if (hint) hint.textContent = '';
  } else {
    if (hint) hint.textContent = '';
  }
  const submitBtn = $('np-submit');
  if (submitBtn) submitBtn.textContent = state.editingProjectId ? 'Simpan Perubahan' : projectSubmitLabel(state.userRole || 'student', sel.value);
  updateMemberSlotsVisibility();
  const cbGrp = $('np-isgroup');
  if (cbGrp && cbGrp.checked) renderGroupFields();
}

function toggleGroupFields() {
  const cb = $('np-isgroup');
  const fields = $('np-group-fields');
  if (!cb || !fields) return;
  fields.classList.toggle('hidden', !cb.checked);
  updateMemberSlotsVisibility();
  if (cb.checked) renderGroupFields();
}

function currentGroupConfig() {
  const count = Math.max(0, Math.min(20, parseInt($('np-groupcount')?.value, 10) || 0));
  const per = Math.max(1, Math.min(20, parseInt($('np-pergroup')?.value, 10) || 1));
  return { count, per };
}
function coursesTaughtByLecturer(nip) {
  if (!nip) return [];
  const assigned = getLecturerCourses(nip).map(item => item && item.course).filter(Boolean);
  const offered = ((db.masterData && db.masterData.courseOfferings) || [])
    .filter(item => String(item.lecturerNip || '') === String(nip)).map(item => item.course).filter(Boolean);
  return [...new Set([...assigned, ...offered].map(c => String(c).trim()).filter(Boolean))];
}
function studentsTakingLecturerCourses(nip) {
  const taught = new Set(coursesTaughtByLecturer(nip));
  if (!taught.size) return [];
  return collectStudentOptions().filter(student => {
    const enrolled = studentCourses(student.nim);
    // Data enrolmen yang tidak tercatat tidak dianggap memenuhi syarat.
    return Array.isArray(enrolled) && enrolled.some(course => taught.has(String(course).trim()));
  });
}
function newProjectStudentPool() {
  if (isCourseProjectForm()) {
    const course = $('np-course')?.value || '';
    const angkatan = $('np-c-angkatan')?.value || '';
    const kelas = Array.from(document.querySelectorAll('.np-c-kelas:checked')).map(cb => cb.value);
    const nip = selectedProjectLecturerNip();
    // Termasuk pembuat proyek; mahasiswa memilih sendiri apakah bergabung dan ke kelompok mana.
    return getFilteredStudentsForLecturer(course, angkatan, kelas, nip);
  }
  let students = collectStudentOptions();
  const category = $('np-category')?.value || '';
  if (category === COMMUNITY_CATEGORY) {
    students = students.filter(student => studentTakesCommunityCourse(student.nim));
  } else if (state.userRole === 'lecturer') {
    // Untuk proyek umum buatan dosen, hanya mahasiswa yang mengambil minimal satu
    // mata kuliah yang diampu dosen aktif yang boleh dipilih menjadi anggota.
    students = studentsTakingLecturerCourses(activeLecturerRecord()?.nip || SEED.lecturer?.nip);
  }
  if (state.userRole === 'student') {
    const cohort = currentStudentCohort();
    // Proyek umum/IUM buatan mahasiswa hanya boleh memilih rekan satu angkatan.
    if (!cohort) return [];
    students = students.filter(student => String(student.angkatan || '').trim() === cohort);
  }
  return students;
}

function renderGroupFields() {
  const container = $('np-groups-container');
  if (!container) return;
  const { count, per } = currentGroupConfig();
  const courseProjectForm = isCourseProjectForm();
  updateGroupCapacityHint();

  if (count === 0) {

    return;
  }

  const domExisting = collectGroupsFromDOM();
  const seededGroups = Array.isArray(state.projectFormInitialGroups) ? state.projectFormInitialGroups : [];
  const existing = domExisting.length ? domExisting : seededGroups;
  if (Array.isArray(state.projectFormInitialGroups)) state.projectFormInitialGroups = null;
  const students = newProjectStudentPool();
  const poolNims = new Set(students.map(s => s.nim));
  const emptyMsg = courseProjectForm && !students.length

  let html = '';
  for (let i = 0; i < count; i++) {

    const shownCount = selectedNims.length;
    html += `
      <div class="p-3 rounded-2xl border border-violet-200 bg-white space-y-3">
        <div class="flex items-center gap-2">
          <span class="w-7 h-7 rounded-full bg-violet-600 text-white flex items-center justify-center text-2xs font-bold shrink-0">${i + 1}</span>
          <input type="text" class="grp-name inp flex-1" data-group-index="${i}"
                 placeholder="Nama kelompok" value="${esc(g.name || ('Kelompok ' + (i + 1)))}"
                 style="padding:.5rem .8rem;font-size:.75rem;">
          <span class="text-2xs font-bold text-slate-500 shrink-0"><span class="grp-count" data-group-index="${i}">${shownCount}</span>/${per}</span>
        </div>
        <p class="grp-status text-2xs font-semibold" data-group-index="${i}"></p>
        <details class="rounded-xl border border-slate-200 overflow-hidden">
          <summary class="cursor-pointer text-2xs font-bold text-violet-700 px-3 py-2 bg-slate-50 hover:bg-slate-100">Pilih Anggota</summary>
          <input type="text" class="grp-search inp mt-2 mx-2" data-group-index="${i}" placeholder="Cari nama atau NIM..." style="width:calc(100% - 1rem);"
                 oninput="applyGroupMemberFilters()" autocomplete="off">
          <div class="max-h-48 overflow-y-auto scroll-thin-light mt-2 divide-y divide-slate-100" data-group-members="${i}">
            ${students.length ? students.map(s => {
              const checked = selectedNims.includes(s.nim) ? 'checked' : '';
              return `
              <label class="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-violet-50/60 transition"
                     data-group-member-search="${esc((s.name + ' ' + s.nim + ' ' + (s.prodi || '')).toLowerCase())}"
                     data-angkatan="${esc(s.angkatan || '')}" data-kelas="${esc(s.kelas || '')}">
                <input type="checkbox" class="grp-member-checkbox w-4 h-4 rounded border-slate-300 text-violet-600 focus:ring-violet-500"
                       data-group-index="${i}" value="${esc(s.nim)}"
                       data-name="${esc(s.name)}" data-nim="${esc(s.nim)}" data-prodi="${esc(s.prodi || '')}"
                       onchange="updateGroupCount(${i}, this)" ${checked}>
                <div class="min-w-0 flex-1">
                  <p class="text-2xs font-bold text-slate-800 truncate">${esc(s.name)}</p>
                  <p class="text-[10px] text-slate-500 truncate">${esc(s.nim)} · ${esc(s.prodi || '-')} · ${esc(s.angkatan || '-')} · ${esc(s.kelas || '-')}</p>
                </div>
              </label>`;
            }).join('') : `<p class="px-3 py-4 text-center text-2xs text-slate-500">${emptyMsg}</p>`}
            <p class="grp-empty hidden px-3 py-4 text-center text-2xs text-slate-500">Tidak ada mahasiswa yang cocok dengan filter.</p>
          </div>
